  --ok: #2E9E6E; --ok-bg: #E3F3EA; --warn: #D99A06; --warn-bg: #FBF0D1; --bad: #D9534F; --bad-bg: #FBE4E3; --neutral-bg: #ECECE9;

  --font: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  --radius: 12px; --radius-s: 8px; --radius-pill: 999px;
  /* optional decor tokens: off unless a skin sets them */

  --deco: none; --sun-top: transparent; --sun-bot: transparent; --grid-line: transparent; --floor: transparent;
  --glow: 0; --land-mode: fill; --globe-scale: 0.44; --globe-lift: 0; --grat: ; --land-line: ; --bevel: none; --chrome-h: 0px; --chrome-bar: transparent; --chrome-title: "";
  color-scheme: light;
}

/* pins: lavender = chosen/completed works (identity accent 2); yellow = the one in focus (accent 1) */
:root { --pin: var(--lavender); --pin-hot: var(--yellow); --pin-un: var(--coral); }
/* unrealized = concepts and proposals never built: their own colour, drawn as a ring */
:root[data-skin="mintrail"], :root[data-skin="tint"] { --pin-un: #E8A21A; }
:root[data-skin="pastel"] { --pin-un: #F08A3C; }
/* partners & collaborators: their own layer, a green dot (blue on the Col.labs skins, where green is the focus colour) */
:root { --pin-pa: #2FB57E; --net-partner: #2FB57E; --net-collab: #1C9DB5; --net-colleague: #7B83EB; --net-client: #DB8A2A; --net-ext: #97ADA2; }
:root[data-skin="mintrail"], :root[data-skin="tint"] { --pin-pa: #3E7BE0; --net-partner: #3E7BE0; --net-collab: #5B5BD6; --net-colleague: #B06AD9; --net-client: #E07A2A; --net-ext: #9AA3A1; }
:root[data-skin="sunset"] { --pin-pa: #8BE35A; --net-partner: #8BE35A; --net-collab: #FFD166; --net-colleague: #C8A2FF; --net-client: #FF9F43; --net-ext: #B8C4BF; }
:root[data-skin="pastel"] { --pin-pa: #4FCB7E; --net-partner: #4FCB7E; --net-collab: #F2C14E; --net-colleague: #A98BFF; --net-client: #F08A3C; --net-ext: #A9B7B1; }
:root[data-skin="neon"] { --pin-pa: #39FF88; --net-partner: #39FF88; --net-collab: #FFE45E; --net-colleague: #B58CFF; --net-client: #FF9F43; --net-ext: #9FB0AA; }
/* SaSS · website: follows studioartsupportservices.com — pure white page, pure black type in Arial, black pill buttons in Poppins,
   no rules or tints; the only colour is the blue of the tiled letter in the site's logo, used for the pin in focus */
:root[data-skin="sass"] {
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F3F3F3; --line: #E8E8E8;
  --ink: #000000; --ink-2: #3D3D3D; --ink-3: #8A8A8A;
  --rail: #000000; --rail-ink: #FFFFFF; --rail-dim: #BDBDBD; --rail-hover: #1A1A1A; --rail-on: #FFFFFF; --rail-on-ink: #000000; --rail-line: #262626;
  --primary: #000000; --primary-ink: #FFFFFF; --select: #000000; --select-ink: #FFFFFF; --neutral-bg: #F3F3F3;
  --lavender: #000000; --yellow: #1F8FE0; --coral: #8A8A8A;
  --globe-sea: #FFFFFF; --globe-land: #E6E6E6; --land-line: #FFFFFF; --grat: rgba(0,0,0,.06);
  --font: Arial, Helvetica, sans-serif; --font-display: Arial, Helvetica, sans-serif;
  --radius: 0px; --radius-s: 2px; --radius-pill: 300px;
}
:root[data-skin="sass"] .brand h1 { font-weight: 400; letter-spacing: -.03em; font-size: clamp(30px, 4vw, 46px); }
:root[data-skin="sass"] .brand .eyebrow, :root[data-skin="sass"] .side-head .eyebrow { letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 13px; color: var(--ink); }
:root[data-skin="sass"] .hud button, :root[data-skin="sass"] .hud .sel, :root[data-skin="sass"] .cta { background: #000; color: #fff; border-color: #000; font-family: "Poppins", Arial, sans-serif; font-weight: 500; letter-spacing: .02em; border-radius: 300px; }
:root[data-skin="sass"] .hud .sel span, :root[data-skin="sass"] .hud select { color: #fff; }
:root[data-skin="sass"] .hud select option { color: #000; }
:root[data-skin="sass"] .hud button:hover { background: #262626; color: #fff; }
:root[data-skin="sass"] .chip { font-family: "Poppins", Arial, sans-serif; border-color: #000; color: #000; }
:root[data-skin="sass"] .chip.on { background: #000; color: #fff; }
:root[data-skin="sass"] .chip.on i:not(.un) { background: #fff; }
:root[data-skin="sass"] .side { border-left-color: #000; }

@media (max-width: 860px) { :root[data-skin="sass"] .brand h1, :root[data-skin="sass-dark"] .brand h1 { font-size: 34px; } }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
a { color: inherit; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lavender); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: 1fr 400px; grid-template-rows: 100%; }
.stage { position: relative; min-width: 0; background: var(--stage-bg); }
canvas#globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#globe.grabbing { cursor: grabbing; }
canvas#globe.pointer { cursor: pointer; }

.brand { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; padding-top: 20px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 16px; pointer-events: none; }
.brand .eyebrow { font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.brand h1 { margin: 0; font: 800 clamp(24px, 3vw, 34px)/1.1 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.brand h1::after { content: var(--kana); margin-left: .45em; font: 700 .42em/1 "Zen Maru Gothic", "Noto Sans CJK JP", var(--font); letter-spacing: .25em; color: var(--lavender); vertical-align: middle; }
.brand p { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; max-width: 44ch; }
.brand .stat { display: inline-flex; gap: 14px; margin-top: 12px; font: 500 12px/1 var(--font); color: var(--ink-3); }
.brand .stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.hud { position: absolute; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hud button, .hud .sel { background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); border-radius: var(--radius-pill); padding: 7px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;  box-shadow: var(--bevel);}
.hud button:hover { color: var(--ink); background: var(--surface-2); }
.hud .sel { padding: 0 10px 0 12px; gap: 4px; }
.hud .sel span { color: var(--ink-3); font-size: 12px; }
.hud select { background: none; border: 0; padding: 7px 4px; color: var(--ink); cursor: pointer; }

.tip { position: absolute; transform: translate(-50%, calc(-100% - 16px)); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 7px 10px; font-size: 13px; white-space: nowrap; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.tip b { font-weight: 600; }
.tip small { display: block; color: var(--ink-2); font-size: 11.5px; }

.side { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; box-shadow: var(--bevel); }
.side::before { content: var(--chrome-title); flex: none; height: var(--chrome-h); background: var(--chrome-bar); color: #FFFFFF; font: 700 13px/var(--chrome-h) var(--font); white-space: pre; overflow: hidden; }
.side-head { padding: 18px 20px 12px; padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.side-head .eyebrow { font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0 10px;  box-shadow: var(--bevel);}
.search input { flex: 1; min-width: 0; background: none; border: 0; padding: 9px 0; color: var(--ink); font: inherit; }
.search input::placeholder { color: var(--ink-3); }
.search svg { color: var(--ink-3); flex: none; }
.facets { display: grid; gap: 8px; margin-top: 8px; }
.facet.show { margin-top: 12px; }
.facet { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: start; }
.facet .lbl { font: 600 10.5px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 7px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
.facet select { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--ink-2);  box-shadow: var(--bevel);}
.facet select.on { background: var(--select); color: var(--select-ink); border-color: var(--select); }
.clear { margin-top: 10px; background: none; border: 0; padding: 0; color: var(--ink-2); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.clear:hover { color: var(--ink); }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); border-radius: var(--radius-pill); padding: 3px 10px; font-size: 12px; font-weight: 500; cursor: pointer;  box-shadow: var(--bevel);}
.chip.on { background: var(--select); color: var(--select-ink); border-color: var(--select); }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; background: var(--pin); }
.chip i.un { background: none; border: 2px solid var(--pin-un); }
.chip .n { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip:disabled { cursor: default; opacity: .55; }
.badge-un { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: var(--radius-pill); border: 1px solid var(--pin-un); color: var(--ink-2); font: 600 9.5px/1.5 var(--font); letter-spacing: .06em; text-transform: uppercase; vertical-align: 1px; }
.legend i.un { background: none; border: 2px solid var(--pin-un); }
.chip i.pa, .legend i.pa { background: var(--pin-pa); }
.chip i.pa { background: conic-gradient(var(--net-partner) 0 25%, var(--net-collab) 0 50%, var(--net-colleague) 0 75%, var(--net-client) 0); }
i.t-Partner { background: var(--net-partner) !important; } i.t-Collaborator { background: var(--net-collab) !important; } i.t-Colleague { background: var(--net-colleague) !important; }
i.t-Client { background: var(--net-client) !important; } i.t-Extended { background: var(--net-ext) !important; }

: 5.7245, "approx": true, "type": "Permanent public sculpture", "web": "https://www.studioartsupportservices.com/muse", "role": "Co-author and computational designer, with UV LAB", "team": "UV LAB", "text": "A pair of spiralling metal forms whose geometry was generated from 1,346 survey responses from students and staff of Université Grenoble Alpes. Each of its 23 hand-cut, hand-formed panels carries a unique curvature derived from that data, so the sculpture is literally shaped by the community it stands among; its twin spirals also trace the geography of Grenoble, between the dragon and the serpent of the city's two rivers.", "imgs": ["img/muse-p01.jpg", "img/muse-p02.jpg", "img/muse-p03.jpg", "img/muse-p04.jpg", "img/muse-p05.jpg", "img/muse-p06.jpg", "img/muse-p07.jpg", "img/muse-p08.jpg", "img/muse-p09.jpg", "img/muse-p10.jpg", "img/muse-p11.jpg"], "groups": ["Studio SaSS", "UV LAB"], "cats": ["Sculpture"], "roles": ["Co-author / co-designer", "Computational design"], "links": [{"label": "UV LAB", "url": "https://www.uvlab.fr"}, {"label": "Université Grenoble Alpes — the Muse sculpture project", "url": "https://etudiant.univ-grenoble-alpes.fr/en/actualites/news-grenoble/events-calendar/culture/c-est-ma-sculpture--1722561.kjsp"}]}, {"id": "hexalumina", "title": "Hexalumina", "cat": "Sculpture", "collabs": ["Anaisa Franco", "Curious Form"], "materials": ["Steel", "Photovoltaics", "Light"], "place": "Singing Hills Recreation Center, Dallas, Texas, USA", "country": "USA", "year": 2026, "lat": 32.6655, "lng": -96.7795, "approx": true, "type": "Permanent public artwork · solar canopy", "web": "https://www.studioartsupportservices.com/hexalumina", "role": "Computational design — Michael R. DiCarlo / iAASS", "team": "Artist Anaisa Franco · fabricated by Curious Form · City of Dallas Public Art Collection", "text": "Hexalumina is a permanent sculptural canopy that behaves like a living organism: its hexagonal skin collects solar energy by day through organic photovoltaic cells and glows at night on that stored energy. Sited at Singing Hills Recreation Center, it gives the park a shaded gathering place by day and a self-powered landmark after dark.", "imgs": ["img/hexalumina-s4.jpg"], "groups": ["Studio SaSS"], "cats": ["Sculpture"], "roles": ["Computational design"]}, {"id": "hope-peace", "title": "Hope / Peace — Pier 28", "cat": "Sculpture", "collabs": ["Building 180", "Giuseppe Palumbo", "RBHU", "Elemental Studio"], "materials": ["Fiberglass", "Foam", "Steel", "Aluminum"], "place": "Pier 28, The Embarcadero, San Francisco, California, USA", "country": "USA", "year": 2026, "lat": 37.787646, "lng": -122.38746, "type": "Public sculpture pair", "web": null, "role": "Technical producer for Building 180: checked the as-built armature base plates against the RBHU permit set and Port engineering requirements; coordinated artist and base-plate fabricator", "team": "Artist Giuseppe Palumbo · structural engineers RBHU (Kevin Church, Ali Lahijanian, Selinda Martinez) · base plates Joel Millikan, Elemental Studio · Building 180 (Meredith Winner, Annabelle Lee) · Port of San Francisco", "text": "Two monumental hands by Giuseppe Palumbo, Hope (crossed fingers) and Peace (a peace sign), installed on 22 September 2026 at Pier 28 on the Embarcadero, between Red's Java House and Hi-Dive. Each stands 10 ft tall: a solid foam and fiberglass form with a hard-coat epoxy finish, carried on a welded steel armature cantilevered from bolted base plates. That load path let the Port approve the work without analysing the foam. The pedestals are timber-framed and aluminum-clad. The images are from the stamped RBHU permit set.", "imgs": [], "groups": ["Building 180"], "cats": ["Sculpture"], "roles": ["Technical production"], "links": [{"label": "Building 180", "url": "https://building180.com"}, {"label": "Port of San Francisco — Big Art Loop Portside", "url": "https://www.sfport.com/about/news/big-art-loop-portside-port-san-francisco-partners-big-art-loop"}, {"label": "Rbhu", "url": "https://www.rbhu.org"}]}, {"id": "lips", "title": "Lips (fnnch)", "cat": "Sculpture", "collabs": ["Building 180", "fnnch", "RBHU", "Elemental Studio"], "materials": ["Stainless steel", "Aluminum", "Paint"], "place": "South Beach Marina, The Embarcadero, San Francisco, California, USA", "country": "USA", "year": 2026, "lat": 37.779966, "lng": -122.387896, "type": "Public sculpture · 1-year installation", "web": null, "role": "Technical producer for Building 180: annotated the stamped RBHU drawings with ADA 11B references, the 1:2 plate bevel and the rubber-mat friction callout; ballast-plate and pier-load coordination", "team": "Artist fnnch (Edward Marks) with installer L. Stockhausen · engineer Ali Lahijanian, RBHU · rigging Joel Millikan, Elemental Studio · Building 180 (Annabelle Lee, Meredith Winner) · Port of San Francisco · photos Lana Shapoval", "text": "A monumental pair of glossy red pop-art lips by fnnch, 20 × 12 × 4 ft and about 2,000 lb, installed in summer 2026 for one year on the paved pad beside South Beach Yacht Club. It has a stainless steel frame with painted aluminum panels and stands on a three-part steel ballast plate over a recycled-rubber mat. There are no anchors, and the load on the pier stays under 100 psf. The piece is on loan from collectors and maintained with Building 180 and Port ambassador visits. Photos by Lana Shapoval.", "imgs": ["img/lips-b180-4.jpg"], "groups": ["Building 180"], "cats": ["Sculpture"], "roles": ["Technical production"], "links": [{"label": "Building 180", "url": "https://building180.com"}, {"label": "Port of San Francisco — Big Art Loop Portside", "url": "https://www.sfport.com/about/news/big-art-loop-portside-port-san-francisco-partners-big-art-loop"}, {"label": "Rbhu", "url": "https://www.rbhu.org"}]}, {"id": "fly-ranch-effigy", "title": "Fly Ranch Effigy 2026 (Temple of FOOB)", "cat": "Temporary installation", "collabs": ["AWA Collective"], "materials": ["Reclaimed timber", "Natural materials"], "place": "Fly Ranch, Nevada, USA", "country": "USA", "year": 2026, "lat": 40.833805, "lng": -119.333954, "approx": true, "type": "Temporary installation", "web": "https://www.studioartsupportservices.com/flyeffigy", "role": "Co-lead", "team": "Emi Watanabe, AWA Collective", "text": "An impromptu, collaborative work built on site from construction scrap and natural materials: a celebratory focal point described as a temple-for-one. Its portal directs the gaze and forms a threshold participants walk through, inviting reflection and a sense of renewal.", "imgs": ["img/fly-ranch-effigy-p01.jpg", "img/fly-ranch-effigy-p02.jpg", "img/fly-ranch-effigy-p03.jpg", "img/fly-ranch-effigy-p04.jpg", "img/fly-ranch-effigy-p05.jpg", "img/fly-ranch-effigy-p06.jpg", "img/fly-ranch-effigy-p07.jpg", "img/fly-ranch-effigy-p08.jpg", "img/fly-ranch-effigy-p09.jpg", "img/fly-ranch-effigy-p10.jpg", "img/fly-ranch-effigy-p11.jpg", "img/fly-ranch-effigy-p12.jpg"], "groups": ["Studio SaSS", "Burning Man", "Fly Ranch"], "cats": ["Temporary installation"], "roles": ["Co-author / co-designer", "Build / installation"], "links": [{"label": "Burning Man Project", "url": "https://burningman.org"}, {"label": "Charly Fei (AWA Collective)", "url": "https://charlyfei.art/"}]}, {"id": "ensembles", "title": "ENSEMBLE.s (ZAT Montpellier)", "cat": "Participatory artwork", "collabs": ["UV LAB", "Quentin Alart"], "materials": ["Steel", "Ceramic zellige", "Timber"], "place": "La Mosson, Montpellier, France", "country": "France", "year": 2025, "lat": 43.6186, "lng": 3.8208, "approx": true, "type": "Participatory permanent urban artwork", "web": "https://www.studioartsupportservices.com/zat", "role": "Co-author and computational designer, with UV LAB", "team": "UV LAB · structural engineering Quentin Alart · prefabrication AMA · ZAT 2025, financed by the City of Montpellier", "text": "A hyperboloid of metal clad in more than 8,000 hand-made ceramic zellige pieces, each designed and produced by residents of La Mosson over a four-week open atelier. Conceived by UV LAB for ZAT 2025, it stands on a hilltop crossroads among Mediterranean trees as a crown, a channel and a gathering point — made with the neighbourhood, not just for it.", "imgs": ["img/ensembles-p01.jpg", "img/ensembles-p02.jpg", "img/ensembles-p03.jpg", "img/ensembles-p04.jpg", "img/ensembles-p05.jpg", "img/ensembles-p06.jpg"], "groups": ["Studio SaSS", "UV LAB"], "cats": ["Participatory artwork"], "roles": ["Co-author / co-designer", "Computational design", "Fabrication strategy"], "links": [{"label": "UV LAB — ENSEMBLE.s", "url": "https://www.uvlab.fr/ensemble-s"}]}, {"id": "kokrobite-playground", "title": "Kokrobite Playground — HOME Academy", "cat": "Playspace", "collabs": ["Urban Col.labs", "Relief Crew Foundation", "H.O.M.E. Ghana"], "materials": ["Timber"], "place": "HOME Academy, Kokrobite, Greater Accra, Ghana", "country": "Ghana", "year": 2026, "lat": 5.495, "lng": -0.364, "approx": true, "type": "Volunteer-built playspace", "web": null, "role": "Design of the playspace (volunteer) — second iteration of the Lesvos playground", "team": "Relief Crew Foundation · H.O.M.E. Ghana · Urban Col.labs", "text": "The second iteration of the volunteer-built playground, this time on the grounds of HOME Academy, a new two-storey school in the fishing town of Kokrobite west of Accra, built with the Ghanaian non-profit H.O.M.E. and the Relief Crew Foundation. More than twenty yacht crew from ten vessels joined local contractors and the H.O.M.E. team over three phases (ground-breaking October/November 2025, classrooms and carpentry February 2026, completion June 2026); the playground was finished with the school in the final phase, when the students moved into their seven new classrooms.", "imgs": [], "groups": ["Urban Col.labs"], "cats": ["Playspace", "Humanitarian", "Educational"], "roles": ["Design lead", "Volunteer"], "links": [{"label": "Urban Col.labs — Placemaking 4 Good", "url": "https://www.urbancollabs.com/p4g"}, {"label": "Relief Crew Foundation — projects", "url": "https://www.reliefcrewfoundation.org/projects"}]}, {"id": "lesvos-playground", "title": "Lesvos Playground", "cat": "Playspace", "collabs": ["Urban Col.labs", "Relief Crew Foundation"], "materials": ["Timber", "Rope"], "place": "Lesvos, Greece", "country": "Greece", "year": 2025, "lat": 39.26451, "lng": 26.277707, "approx": true, "type": "Volunteer-built playspace", "web": "https://www.studioartsupportservices.com/lesvos-playground", "role": "Design of the playspace (volunteer)", "team": "Urban Col.labs · Relief Crew Foundation", "text": "A volunteer effort to design and build a playspace for children living in one of Europe's largest refugee camps, on the island of Lesvos. The team built a timber climbing structure with a slide, rope net, tyre swing, climbing wall and playhouse, beside the beach.", "imgs": ["img/lesvos-playground-p01.jpg", "img/lesvos-playground-p02.jpg", "img/lesvos-playground-p03.jpg", "img/lesvos-playground-p04.jpg", "img/lesvos-playground-p05.jpg", "img/lesvos-playground-p06.jpg", "img/lesvos-playground-p07.jpg", "img/lesvos-playground-p08.jpg", "img/lesvos-playground-p09.jpg"], "groups": ["Studio SaSS", "Urban Col.labs"], "cats": ["Playspace", "Humanitarian"], "roles": ["Design lead", "Build / installation", "Volunteer"], "links": [{"label": "Urban Col.labs — Placemaking 4 Good", "url": "https://www.urbancollabs.com/p4g"}, {"label": "Relief Crew Foundation — projects", "url": "https://www.reliefcrewfoundation.org/projects"}]}, {"id": "un-nuevo-camino", "title": "Un Nuevo Camino", "cat": "Sculpture", "collabs": ["Kidnetick", "Mark Rivera", "The Generator"], "materials": ["Mixed media"], "place": "Black Rock City, Nevada, USA — Burning Man 2025", "country": "USA", "year": 2025, "lat": 40.910733, "lng": -119.05601, "type": "Festival sculpture", "web": "https://www.studioartsupportservices.com/un-nuevo-camino", "role": "Design and fabrication support", "team": "Kidnetick (designer-fabricator, The Generator, Reno) · Mark Rivera", "text": "Un Nuevo Camino (\"a new path\") is a sculpture made for Burning Man 2025 with Puerto Rican designer-fabricator Kidnetick. A larger-than-life astronaut stands beside a child astronaut in the playa haze; both suits are densely covered in hand-written graffiti and carry control panels and cabling.", "imgs": ["img/un-nuevo-camino-p01.jpg", "img/un-nuevo-camino-p02.jpg", "img/un-nuevo-camino-p03.jpg"], "groups": ["Burning Man"], "cats": ["Sculpture"], "roles": ["Computational design", "Fabrication strategy"], "links": [{"label": "Kidnetick — Mark Rivera", "url": "https://www.kidnetick.com"}, {"label": "The Generator", "url": "https://www.therenogenerator.com"}]}, {"id": "interlace", "title": "Interlace", "cat": "Interactive installation", "collabs": ["Anaisa Franco", "Matt McConnell"], "materials": ["Steel", "Light"], "place": "RiversEdge, St. Johns River, Jacksonville, Florida, USA", "country": "USA", "year": 2024, "lat": 30.3129, "lng": -81.652, "approx": true, "type": "Interactive public installation", "web": "https://www.studioartsupportservices.com/interlace", "role": "Co-design, layout, art direction, signage detailing, pre-visualization — iAASS", "team": "Co-designed with Anaisa Franco · fabricated by Matt McConnell", "text": "Six illuminated swings arranged along the riverfront promenade of the RiversEdge community, each able to hold several people. The piece invites strangers to sit side by side and set the installation in motion; light and movement interlace as people swing, turning a stretch of waterfront into a shared social moment.", "imgs": ["img/interlace-p01.jpg", "img/interlace-p02.jpg", "img/interlace-p03.jpg", "img/interlace-p04.jpg", "img/interlace-p05.jpg", "img/interlace-p06.jpg", "img/interlace-p07.jpg", "img/interlace-p08.jpg", "img/interlace-p09.jpg", "img/interlace-p10.jpg", "img/interlace-p11.jpg", "img/interlace-p12.jpg", "img/interlace-p13.jpg"], "groups": ["Studio SaSS"], "cats": ["Interactive installation"], "roles": ["Co-author / co-designer", "Art direction", "Design development"]}, {"id": "ouroboros", "title": "Ouroboros", "cat": "Temporary installation", "collabs": ["UV LAB"], "materials": ["Plywood", "Light"], "place": "Vabaduse väljak, Viljandi, Estonia", "country": "Estonia", "year": 2024, "lat": 58.3639, "lng": 25.59, "type": "Festival installation", "web": "https://www.studioartsupportservices.com/ouroboros", "role": "Co-author and computational designer, with UV LAB", "team": "UV LAB · Viljandi Tuled visual arts festival (Tartu 2024, European Capital of Culture)", "text": "Ouroboros revives the ancient symbol of the serpent eating its tail — eternity, cycle, regeneration — as a 9 × 9 × 5 m looping plywood waffle structure in Viljandi's Freedom Square, lit from within. Its layered profile nods to Estonian traditional roofs, and it was fabricated and assembled using mixed reality.", "imgs": ["img/ouroboros-p01.jpg", "img/ouroboros-p02.jpg", "img/ouroboros-p03.jpg", "img/ouroboros-p04.jpg", "img/ouroboros-p05.jpg", "img/ouroboros-p06.jpg"], "groups": ["Studio SaSS", "UV LAB"], "cats": ["Temporary installation"], "roles": ["Co-author / co-designer", "Computational design"], "links": [{"label": "UV LAB — Ouroboros", "url": "https://www.uvlab.fr/ouroboros"}]}, {"id": "cascode", "title": "Cascode", "cat": "Architectural artwork", "collabs": ["Eto Otitigbe"], "materials": ["Timber", "Metal"], "place": "Amy Gutmann Hall, University of Pennsylvania, Philadelphia, USA", "country": "USA", "year": 2024, "lat": 39.9522, "lng": -75.1932, "approx": true, "type": "Percent for Art commission", "web": "https://www.studioartsupportservices.com/cascode", "role": "Computational designer, with artist Eto Otitigbe", "team": "Eto Otitigbe · Penn Art Collection", "text": "Percent for Art competition winner for Amy Gutmann Hall at the University of Pennsylvania: a wood and metal façade work that reads as a cascading field across the building's entrance. Completed 2024.", "imgs": ["img/cascode-p01.jpg", "img/cascode-p02.jpg", "img/cascode-p03.jpg"], "groups": ["Studio SaSS"], "cats": ["Architectural artwork"], "roles": ["Computational design"], "links": [{"label": "Eto Otitigbe — CASCODE", "url": "https://www.etootitigbe.com/cascode"}, {"label": "University of Pennsylvania — Cascode", "url": "https://facilities.upenn.edu/maps/art/cascode"}, {"label": "Dashboard — Cascode programme", "url": "https://www.dashboard.us/cascode"}]}, {"id": "man-base-2026", "title": "Man Base Pavilion 2026 — Cryptomeria", "cat": "Pavilion", "collabs": ["Burning Man Project", "Alexander Rose"], "materials": ["Timber"], "place": "Black Rock City, Nevada, USA — Burning Man 2026", "country": "USA", "year": 2026, "lat": 40.7864, "lng": -119.2065, "type": "Man Pavilion", "web": "https://www.studioartsupportservices.com/man-base-2026", "role": "Design Engineer, Man Base Design Lead — Burning Man Project", "team": "Pavilion design Alexander (Zander) Rose · built by the Man Base crew · Burning Man Project (Man Pavilion art director Kim Cook)", "text": "Cryptomeria, the 2026 Man Pavilion by Alexander (Zander) Rose for the theme Axis Mundi, inspired by Japan's ancient Jōmon Sugi cedar. Visitors arrive along a path of meandering roots; an outer helical staircase rises nearly 60 ft to the base of the Man while a second spiral descends through the centre, the two forming a double helix around which the city symbolically turns. Third year as design engineer and Man Base design lead: design engineering, detailing and on-site coordination on a compressed schedule.", "imgs": ["img/man-base-2026-p01.jpg", "img/man-base-2026-p02.jpg", "img/man-base-2026-p03.jpg", "img/man-base-2026-p04.jpg", "img/man-base-2026-p05.jpg", "img/man-base-2026-p06.jpg", "img/man-base-2026-p07.jpg", "img/man-base-2026-p08.jpg", "img/man-base-2026-p09.jpg", "img/man-base-2026-p10.jpg", "img/man-base-2026-p11.jpg", "img/man-base-2026-p12.jpg", "img/man-base-2026-p13.jpg", "img/man-base-2026-p14.jpg"], "groups": ["Burning Man"], "cats": ["Pavilion"], "roles": ["Design engineering", "Design lead"], "links": [{"label": "Burning Man — Cryptomeria, the 2026 Man Pavilion", "url": "https://journal.burningman.org/2026/01/news/official-announcements/black-rock-city-2026-man-pavilion/"}, {"label": "Rose Futures — Alexander Rose", "url": "https://rosefutures.com/"}], "photoCredit": "Photos: Allain Ioos Sophie, Danee Hazama, Eleanor Preger, Jamen Percy, Mark Fromson, Luciano Lejtman, Jon Bookout, Scott London / Burning Man Project"}, {"id": "man-base-2025", "title": "Man Base Pavilion 2025 — The World Fair of Unity", "cat": "Pavilion", "collabs": ["Burning Man Project", "Mark Rivera"], "materials": ["Timber"], "place": "Black Rock City, Nevada, USA — Burning Man 2025", "country": "USA", "year": 2025, "lat": 40.7864, "lng": -119.2065, "type": "Man Pavilion", "web": "https://www.studioartsupportservices.com/man-base-2025", "role": "Design Engineer, Man Base Design Lead — Burning Man Project", "team": "Pavilion design Mark “Kidnetick” Rivera · built by the Man Base crew · Burning Man Project (Man Pavilion art director Kim Cook)", "text": "The World Fair of Unity, the 2025 Man Pavilion by Puerto Rican artist Mark “Kidnetick” Rivera for the theme Tomorrow Today. Inspired by 19th-century world's fairs and industrial architecture, it served as Black Rock City's global cultural centre, hosting 15 artworks within and around the pavilion; with the Man, the structure stood about 70 ft tall. Second year as design engineer and Man Base design lead: design engineering, detailing and on-site coordination.", "imgs": ["img/man-base-2025-p01.jpg", "img/man-base-2025-p02.jpg", "img/man-base-2025-p03.jpg", "img/man-base-2025-p04.jpg", "img/man-base-2025-p05.jpg", "img/man-base-2025-p06.jpg", "img/man-base-2025-p07.jpg", "img/man-base-2025-p08.jpg", "img/man-base-2025-p09.jpg", "img/man-base-2025-p10.jpg"], "groups": ["Burning Man"], "cats": ["Pavilion"], "roles": ["Design engineering", "Design lead"], "links": [{"label": "Burning Man — 2025 timeline", "url": "https://history.burningman.org/timeline/2025"}, {"label": "Kidnetick — Mark Rivera", "url": "https://www.kidnetick.com"}], "photoCredit": "Photos: Eleanor Preger, Duncan Rawlinson, Jon Bookout, Mark Fromson, Mattias Löw, Ranny Víquez, Scott London / Burning Man Project"}, {"id": "man-base-2024", "title": "Man Base Pavilion 2024 — The Other", "cat": "Pavilion", "collabs": ["Burning Man Project", "Jen Lewin"], "materials": ["Timber"], "place": "Black Rock City, Nevada, USA — Burning Man 2024", "country": "USA", "year": 2024, "lat": 40.7864, "lng": -119.2065, "type": "Man Pavilion", "web": "https://www.studioartsupportservices.com/man-base-2024", "role": "Design Engineer, Man Base Design Lead — Burning Man Project", "team": "Pavilion design Jen Lewin (Jen Lewin Studio) · lighting design and light animation Mark Slee · built by the Man Base crew · Burning Man Project (Man Pavilion art director Kim Cook)", "text": "The Other, the 2024 Man Pavilion by New York artist-engineer Jen Lewin, chosen from 21 concept submissions for the theme Curiouser & Curiouser. Eight curved, canyon-like arms wind out as stairways and ramps to upper and lower lookout points, framing views outward to the Man and the city and inward to the shared space beneath. First year on the Burning Man Project core team as design engineer and Man Base design lead: design engineering, detailing and on-site coordination with the Man Base crew.", "imgs": ["img/man-base-2024-p01.jpg", "img/man-base-2024-p02.jpg", "img/man-base-2024-p03.jpg", "img/man-base-2024-p04.jpg", "img/man-base-2024-p05.jpg", "img/man-base-2024-p06.jpg", "img/man-base-2024-p07.jpg", "img/man-base-2024-p08.jpg", "img/man-base-2024-p09.jpg", "img/man-base-2024-p10.jpg"], "groups": ["Burning Man"], "cats": ["Pavilion"], "roles": ["Design engineering", "Design lead"], "links": [{"label": "Burning Man — 2024 Man Pavilion announcement", "url": "https://journal.burningman.org/2024/03/burning-man-arts/brc-art/announcing-the-2024-man-pavilion"}, {"label": "Jen Lewin Studio — The Other", "url": "https://www.jenlewinstudio.com/portfolio/the-other/"}], "photoCredit": "Photos: Duncan Rawlinson, Mark Fromson, Arturo Gómez, Danee Hazama, Gurpreet Chawla, Mark Nixon / Burning Man Project"}, {"id": "noun0", "title": "Noun 0", "cat": "Sculpture", "collabs": ["The Most Famous Artist", "Art City"], "materials": ["Cast concrete", "Water"], "place": "Art City, Tucumcari, New Mexico, USA", "country": "USA", "year": 2025, "yearLabel": "2023–2025", "lat": 35.1717, "lng": -103.725, "approx": true, "type": "Cast-concrete sculpture and fountain", "web": "https://www.studioartsupportservices.com/noun0", "role": "Design lead", "team": "The Most Famous Artist studio (Matt Monahan) · Art City", "text": "A 100 × 60 ft cast-concrete sculpture laid out as a pixelated block field — the face of Noun 0, the first NFT minted by the Nouns DAO — with an integrated fountain and pools. Read from above it is a pixel portrait; at ground level it is a landscape of concrete steps, platforms, walkways and water that people climb, sit on and swim in.", "imgs": ["img/noun0-p01.jpg", "img/noun0-p02.jpg", "img/noun0-p03.jpg", "img/noun0-p04.jpg", "img/noun0-p05.jpg", "img/noun0-p06.jpg", "img/noun0-p07.jpg", "img/noun0-p08.jpg", "img/noun0-p09.jpg", "img/noun0-p10.jpg", "img/noun0-p11.jpg", "img/noun0-p12.jpg", "img/noun0-p13.jpg", "img/noun0-p14.jpg"], "groups": ["Studio SaSS"], "cats": ["Sculpture"], "roles": ["Design lead"], "links": [{"label": "The Most Famous Artist", "url": "https://www.themostfamousartist.com"}]}, {"id": "princess-theatre", "title": "Tucumcari Princess Theatre", "cat": "Architectural artwork", "collabs": ["Urban Col.labs", "Upspring Associates"], "materials": ["Light", "Paint"], "place": "Tucumcari, New Mexico, USA", "country": "USA", "year": 2023, "lat": 35.1717, "lng": -103.725, "type": "Public-art façade redesign", "web": "https://www.studioartsupportservices.com/tpt", "role": "Artist-designer", "team": "Urban Col.labs · Upspring Associates", "text": "A public-art-driven façade redesign of the historic Art Deco Princess Theater, meant to spur downtown revitalisation: the theatre becomes a visual landmark and a platform for recurring art and light events that draw local activity and tourism.", "imgs": ["img/princess-theatre-p01.jpg", "img/princess-theatre-p02.jpg", "img/princess-theatre-p03.jpg", "img/princess-theatre-p04.jpg", "img/princess-theatre-p05.jpg"], "groups": ["Studio SaSS", "Urban Col.labs"], "cats": ["Architectural artwork", "A.O.D"], "roles": ["Design lead"], "links": [{"label": "Urban Col.labs", "url": "https://www.urbancollabs.com"}, {"label": "Upspring Associates", "url": "https://upspringassociates.com"}]}, {"id": "vibrant-meridian", "title": "Vibrant Meridian", "cat": "Sculpture", "collabs": ["Anaisa Franco", "Mohawk Valley EDGE"], "materials": ["Stainless steel", "Paint"], "place": "Marcy Nanocenter, Marcy, New York, USA", "country": "USA", "year": 2023, "lat": 43.1704, "lng": -75.2846, "approx": true, "type": "Permanent public sculpture", "web": "https://www.studioartsupportservices.com/vibrant-meridian", "role": "Concept development, design and project management — iAASS", "team": "Co-designed with Anaisa Franco · commissioned by Mohawk Valley EDGE", "text": "A 25-foot sculpture of sweeping, gradient-coloured painted stainless-steel strips in the roundabout at the gateway to the Wolfspeed semiconductor fab. Its geometry is drawn from the semiconductor wafer — the disc behind electric vehicles and 5G — and the circulating traffic makes the static ribs appear to move. Installed November 2023.", "imgs": ["img/vibrant-meridian-p01.jpg", "img/vibrant-meridian-p02.jpg", "img/vibrant-meridian-p03.jpg", "img/vibrant-meridian-p04.jpg", "img/vibrant-meridian-p05.jpg", "img/vibrant-meridian-p06.jpg", "img/vibrant-meridian-p07.jpg", "img/vibrant-meridian-p08.jpg", "img/vibrant-meridian-p09.jpg" .jpg", "img/embraced-loop-p02.jpg", "img/embraced-loop-p03.jpg", "img/embraced-loop-p04.jpg", "img/embraced-loop-p05.jpg"], "groups": ["Studio SaSS"], "cats": ["Memorial"], "roles": ["Design development", "Project management"]}, {"id": "peaceful-journey", "title": "Peaceful Journey", "cat": "Sculpture", "collabs": ["Eto Otitigbe"], "materials": ["Weathering steel", "Stainless steel", "Concrete"], "place": "Mount Vernon, New York, USA", "country": "USA", "year": 2022, "lat": 40.9126, "lng": -73.8371, "approx": true, "type": "Percent for Art commission", "web": "https://www.studioartsupportservices.com/peaceful-journey", "role": "Design translation and fabrication strategy, with artist Eto Otitigbe", "team": "Eto Otitigbe", "text": "Eto Otitigbe's idea of transition shaped into a three-dimensional work in corten steel, stainless steel and concrete. Beyond the overall design, the studio worked out how to fabricate the honeycomb framework with its unevenly spaced openings and junctions.", "imgs": ["img/peaceful-journey-p01.jpg", "img/peaceful-journey-p02.jpg", "img/peaceful-journey-p03.jpg", "img/peaceful-journey-p04.jpg", "img/peaceful-journey-p05.jpg", "img/peaceful-journey-p06.jpg"], "groups": ["Studio SaSS"], "cats": ["Sculpture"], "roles": ["Design development", "Fabrication strategy"], "links": [{"label": "Eto Otitigbe — Peaceful Journey", "url": "https://www.etootitigbe.com/peaceful-journey"}]}, {"id": "whale-shark", "title": "Suspended Whale Shark", "cat": "Event installation", "collabs": ["Fab Pub Ltd", "Balich Wonder Studio"], "materials": ["Steel"], "place": "Lusail, Qatar (built in London, UK)", "country": "Qatar", "year": 2022, "lat": 25.418538, "lng": 51.500792, "approx": true, "type": "Event installation · logistics", "web": "https://www.studioartsupportservices.com/suspended-whale-shark", "role": "Logistics consultant — shipping and crating strategy, QA, fabrication", "team": "Fab Pub Ltd · Balich Wonder Studio", "text": "A steel whale shark built in London and suspended between four skyscrapers in Lusail for the FIFA World Cup 2022 inauguration. The main role was designing the shipping and crating strategy that moved the sculpture in more than 100 sections from London to Qatar on time and without incident.", "imgs": ["img/whale-shark-p01.jpg", "img/whale-shark-p02.jpg", "img/whale-shark-p03.jpg", "img/whale-shark-p04.jpg"], "groups": ["Studio SaSS"], "cats": ["Event installation"], "roles": ["Logistics", "Fabrication strategy"], "links": [{"label": "Mamou-Mani — Whale Shark", "url": "https://mamou-mani.com/project/whale-shark/"}, {"label": "Fab Pub", "url": "https://fab.pub"}]}, {"id": "sunlit-ranch", "title": "Sunlit Ranch", "cat": "Masterplan", "collabs": ["Art City"], "materials": ["Corrugated metal", "Light"], "place": "Tucumcari, New Mexico, USA", "country": "USA", "year": 2023, "yearLabel": "2023–2025", "lat": 35.1717, "lng": -103.725, "approx": true, "type": "Masterplan · art residency and sculpture garden", "web": "https://www.studioartsupportservices.com/sunlit", "role": "Artist-designer — concept development and masterplan", "team": "Private camping and cabin property owner · Art City", "text": "Early concept development for a private camping and cabin property in the New Mexico desert outside Tucumcari. The new programme adds an art residency, studio space and a sculpture garden; the design work covers the dwellings, kitchens, a bath house and an overall masterplan for the property, with corrugated-metal cabins that glow pink and violet after dark.", "imgs": ["img/sunlit-ranch-p01.jpg", "img/sunlit-ranch-p02.jpg", "img/sunlit-ranch-p03.jpg", "img/sunlit-ranch-p04.jpg", "img/sunlit-ranch-p05.jpg", "img/sunlit-ranch-p06.jpg", "img/sunlit-ranch-p07.jpg", "img/sunlit-ranch-p08.jpg"], "groups": ["Studio SaSS"], "cats": ["Masterplan"], "roles": ["Design lead"]}, {"id": "catharsis", "title": "Catharsis", "cat": "Pavilion", "collabs": ["Arthur Mamou-Mani"], "materials": ["Timber"], "place": "Black Rock City, Ne llabs": ["UV LAB"], "materials": ["Timber"], "place": "Strasbourg, France", "country": "France", "year": 2024, "lat": 48.5734, "lng": 7.7521, "approx": true, "type": "Temporary sculptural installation / pavilion", "web": "https://www.studioartsupportservices.com/strasbourg", "role": "Co-author and computational designer, with UV LAB", "team": "UV LAB", "text": "A temporary sculptural installation in Strasbourg drawing on the healing practices of Celtic druids, Roman architects and Christian healers, fusing nature, technology and spirituality into a sphere of healing rooted in trees and the history of the place. Co-authored with UV LAB.", "imgs": ["img/nemus-p01.jpg", "img/nemus-p02.jpg", "img/nemus-p03.jpg", "img/nemus-p04.jpg", "img/nemus-p05.jpg"], "groups": ["UV LAB"], "cats": ["Pavilion"], "roles": ["Co-author / co-designer", "Computational design"], "links": [{"label": "UV LAB — NEMUS", "url": "https://www.uvlab.fr/nemus"}]}, {"id": "galaxia", "title": "Galaxia — Temple at Burning Man 2018", "cat": "Temple", "collabs": ["Arthur Mamou-Mani", "Burning Man Project"], "materials": ["Timber"], "place": "Black Rock City, Nevada, USA", "country": "USA", "year": 2018, "lat": 40.78741, "lng": -119.203333, "type": "Temple", "web": "https://www.studioartsupportservices.com/galaxia", "role": "Artist-builder, project coordination", "team": "Arthur Mamou-Mani", "text": "The 2018 Burning Man Temple, designed by Arthur Mamou-Mani: twenty timber trusses spiralling toward a central point. One of the first US-based team members — procurement, project management, design and engineering of parts and details, directing small crews on site, and installing modules with crane operators and engineers.", "imgs": ["img/galaxia-p01.jpg", "img/galaxia-p02.jpg", "img/galaxia-p03.jpg", "img/galaxia-p04.jpg", "img/galaxia-p05.jpg", "img/galaxia-p06.jpg", "img/galaxia-p07.jpg", "img/galaxia-p08.jpg", "img/galaxia-p09.jpg", "img/galaxia-p10.jpg", "img/galaxia-p11.jpg", "img/galaxia-p12.jpg"], "groups": ["Burning Man"], "cats": ["Temple"], "roles": ["Project management", "Design engineering", "Build / installation"], "links": [{"label": "Mamou-Mani — Temple Galaxia", "url": "https://mamou-mani.com/project/galaxia/"}, {"label": "Burning Man Project", "url": "https://burningman.org"}]}, {"id": "gats-head", "title": "GATS Head", "cat": "Sculpture", "collabs": ["GATS", "Spoke Art"], "materials": ["Mixed media", "Paint"], "place": "ComplexCon, Los Angeles, California, USA", "country": "USA", "year": 2018, "lat": 34.054908, "lng": -118.242643, "type": "Large-scale sculpture", "web": "https://www.studioartsupportservices.com/gats", "role": "Sculpture consultant, artist collaborator — 3D model from 2D paintings, fabrication process design, assembly direction", "team": "Street artist GATS · Spoke Art", "text": "The realisation and production of a 10 ft sculptural work for street artist GATS: his painted head translated from 2D into a buildable 3D form, with the fabrication process designed and the assembly team directed by the studio.", "imgs": ["img/gats-head-p01.jpg", "img/gats-head-p02.jpg", "img/gats-head-p03.jpg"], "groups": ["Studio SaSS"], "cats": ["Sculpture"], "roles": ["Fabrication strategy", "Build / installation"]}, {"id": "worlds-away", "title": "Worlds Away (The Keepers)", "cat": "Event installation", "collabs": ["Skiland Judd", "The Generator", "Vita Motus"], "materials": ["Steel (thin gauge)", "Truss", "Paint"], "place": "Monterey County Fairgrounds, Monterey, California, USA", "country": "USA", "year": 2024, "lat": 36.5928, "lng": -121.8586, "type": "Festival main stage · sculptural figures", "web": "https://www.studioartsupportservices.com/worldsaway", "role": "Fabrication of The Keepers, the two main-stage figures, as subcontractor to lead fabricator Skiland Judd", "team": "Lead fabricator: Skiland Judd; The Generator (Reno); stage and scenic design lead: Vita Motus; festival producer: Pendulum", "text": "The Keepers: the two monumental figures of the Guardians main stage at the debut Worlds Away festival, Monterey County Fairgrounds, 12 October 2024, where Tiësto headlined alongside The Chainsmokers. The festival was produced by Pendulum, with stage and scenic design led by Vita Motus. Studio SaSS fabricated the figures in thin-gauge steel over a truss substructure, painted, as a subcontractor to lead fabricator Skiland Judd, working with The Generator.", "imgs": ["img/worlds-away-p01.jpg", "img/worlds-away-p02.jpg", "img/worlds-away-p03.jpg", "img/worlds-away-p04.jpg", "img/worlds-away-p05.jpg"], "groups": ["Studio SaSS"], "cats": ["Event installation", "Temporary installation"], "roles": ["Build / installation"], "commissionedBy": "Skiland Judd (lead fabricator) for Vita Motus", "dims": "Approx. 30 ft tall × 10 ft wide × 10 ft deep (each figure)", "links": [{"label": "Vita Motus — Worlds Away", "url": "https://vitamotus.com/project/worlds-away-music-festival/"}, {"label": "The Generator", "url": "https://www.therenogenerator.com"}]}, {"id": "individuality", "title": "Individuality", "cat": "Sculpture", "cats": ["Sculpture"], "collabs": ["Building 180", "Art Eclettica", "Mountain Forge"], "materials": ["Steel", "Stainless steel", "Timber"], "place": "24th St & Illinois St, Dogpatch, San Francisco, California, USA", "country": "USA", "year": 2026, "lat": 37.754194, "lng": -122.386975, "type": "Public sculpture", "web": null, "role": "Technical producer for Building 180: compared the as-built H-frame steel with the engineering package for the wind-load check, modelled the non-structural deck-box facade with its ADA bump-out, flagged decking costs for the budget", "team": "Artist / owner team Dominic, Art Eclettica · assembly Mountain Forge (Tony) · Building 180 (Meredith Winner)", "text": "A multi-part steel sculpture with a stainless top piece, brought down from Truckee and installed on 23 September 2026 at 24th and Illinois Streets in Dogpatch by Mountain Forge. It sits on its steel H-frame base inside a new non-structural deck box of timber framing and veneered plywood, which hides the frame and adds an ADA-compliant bump-out in strong contrast with the sidewalk pavers, as the city required.", "dims": "Shipped in pieces: body in three sections, separate circular elements and a stainless top piece", "client": "Building 180", "imgs": [], "groups": ["Building 180"], "roles": ["Technical production"], "links": [{"label": "Building 180", "url": "https://building180.com"}]}, {"id": "u-basket-chapel", "title": "Basket Chapel", "status": "unrealized", "origin": "Open call", "call": "Burning Man Black Rock City Honoraria 2027 — Letter of Intent", "submitted": "2026-10-29", "cat": "Pavilion", "cats": ["Pavilion"], "collabs": ["UV LAB", "Burning Man Project"], "materials": ["Timber", "Steel", "Cane"], "place": "Black Rock City, Nevada, USA", "country": "USA", "year": 2026, "lat": 40.7864, "lng": -119.2065, "type": "Pavilion (temporary, non-burning)", "role": "Lead artist and applicant: concept, computational design, engineering approach and build plan", "team": "Michael R. DiCarlo (lead artist) · UV LAB (structural concept continues their Strasbourg pavilion study)", "text": "A woven shelter on the open playa: an enormous basket turned over, with three sweeping arches drawing together around a lower central canopy, open on every side. A computationally form-found gridshell is rationalised into standard lumber lengths and labelled laser-cut steel brackets, then wrapped and in-filled by hand with bundled cane and woven panels that filter the light by day and turn the shell into a lantern at night.", "dims": "31 ft across · 20 ft high · central canopy about 14 ft", "client": "Burning Man Project · Black Rock City Honoraria (2027 event)", "imgs": ["img/u-basket-chapel-p01.jpg", "img/u-basket-chapel-p02.jpg", "img/u-basket-chapel-p03.jpg"], "groups": ["Studio SaSS", "UV LAB", "Burning Man"], "roles": ["Artist", "Design lead", "Computational design"], "sheet": "UM", "links": [{"labe "USA", "year": 2026, "lat": 40.7864, "lng": -119.2065, "type": "Temple · climbable stepped pyramid (temporary, non-burning)", "role": "Lead artist and applicant: concept, computational design, engineering approach and build plan", "team": "Michael R. DiCarlo (lead artist)", "text": "A climbable stone landscape with a quiet chamber at its heart: a stepped pyramid of steel-mesh gabion baskets filled with natural stone, loosely inspired by Plato’s Allegory of the Cave. Rough terraces invite climbing and looking out; portals lead into a sheltered chamber with its own light, shade and sound; at night concealed lighting spills through the gaps between the stones so the whole volume glows. Modular, affordable and fully reversible.", "dims": "33 × 33 × 14 ft · stepped tiers with portals to a central chamber", "client": "Burning Man Project · Black Rock City Honoraria (2027 event)", "imgs": ["img/u-temple-of-allegory-p01.jpg"], "groups": ["Studio SaSS", "Burning Man"], "roles": ["Artist", "Design lead", "Computational design"], "sheet": "UM"}, {"id": "u-ashland-plaza", "title": "Ashland Plaza", "status": "unrealized", "origin": "Open call", "call": "Ashland Plaza installation open call, Brooklyn", "cat": "Pavilion", "cats": ["Pavilion", "Interactive installation"], "collabs": ["Eto Otitigbe"], "materials": ["Metal"], "place": "Ashland Place, Brooklyn, New York, USA", "country": "USA", "year": 2023, "lat": 40.6866, "lng": -73.9781, "type": "Pavilion · interactive installation (open-call proposal)", "web": "https://www.studioartsupportservices.com/ashland", "role": "Co-designer with Eto Otitigbe: design, computational design, renders", "team": "Michael R. DiCarlo · Eto Otitigbe", "text": "A luminous pavilion proposed for Ashland Plaza in Brooklyn, New York, in response to an open call: a gilded tubular frame of repeated gable “house” outlines with swings hung inside, designed with Eto Otitigbe.", "imgs": ["img/u-ashland-plaza-p01.jpg", "img/u-ashland-plaza-p02.jpg", "img/u-ash     const meta = [].concat(un ? [['Status', ['Unrealized', p.origin, p.outcome].filter(Boolean).join(' · ')], ['Call / RFP', p.call], ['Submitted', p.submitted]] : []).concat(p.status === 'production' ? [['Phase', p.phase]] : []).concat([[un ? 'Proposed site' : 'Location', p.place], ['Year', p.yearLabel || p.year || 'to confirm'], ['Type', [p.type].concat((p.cats || []).filter((c) => c === 'Humanitarian' || c === 'Educational' || c === 'A.O.D')).filter(Boolean).join(' · ')], ['Size', p.dims], ['Material', (p.materials || []).join(', ')], ['Commissioned by', p.commissionedBy], ['Client', p.client], ['Brand / end client', p.brand], ['My role', (p.roles || []).join(' · ')], ['Scope', p.role], ['With', p.team], ['Group', (p.groups || []).join(', ')]]).filter((m) => m[1]);
    detail.innerHTML = '<button type="button" class="back" id="back">‹ All works</button>'
      + '<div class="hero">' + (p.imgs[0] ? '<img src="' + p.imgs[0] + '" alt="' + esc(p.title) + '" data-i="0">' : '<div class="nohero">' + (p.web ? 'Images on the website' : 'No images on file yet') + '</div>') + '</div>'
      + '<div class="body"><h2>' + esc(p.title) + (un ? '<span class="badge-un">Unrealized</span>' : '') + '</h2>'
      + '<dl class="meta">' + meta.map((m) => '<dt>' + m[0] + '</dt><dd>' + esc(m[1]) + '</dd>').join('') + '<dt>Pin</dt><dd class="mono">' + p.lat.toFixed(4) + ', ' + p.lng.toFixed(4) + (p.approx ? ' · city-level' : '') + '</dd></dl>'
      + '<p>' + esc(p.text) + '</p>'
      + (p.web ? '<a class="cta" href="' + p.web + '" target="_blank" rel="noopener">Open on studioartsupportservices.com ↗</a>' : '<div class="cta ghost">' + (un ? 'Unrealized proposal — internal page' : 'Not on the website yet — internal page') + '</div>')
      + (p.links && p.links.length ? '<div class="plinks"><h3>Collaborators &amp; project pages</h3><div class="links">' + p.links.map((l) => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' ↗</a>').join('') + '</div></div>' : '')
      + (p.press && p.press.length ? '<div class="press"><h3>Press</h3>' + p.press.map((r) => '<a href="' + esc(r.url) + '" target="_blank" rel="noopener"><b>' + esc(r.outlet) + '</b><span>' + esc(r.title) + '</span>' + (r.date ? '<small>' + esc(new Date(r.date + 'T12:00:00').toLocaleDateString('en', { day: 'numeric', month: 'short', year: 'numeric' })) + '</small>' : '') + '</a>').join('') + '</div>' : '')
      + (p.imgs.length > 1 ? '<div class="gal">' + p.imgs.map((s, i) => '<img src="' + s + '" alt="" loading="lazy" data-i="' + i + '">').join('') + '</div>' : '')
      + (p.photoCredit ? '<div class="note">' + esc(p.photoCredit) + '</div>' : '')
      + '<div class="note">Open in Google Maps: <a href="https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng + '" target="_blank" rel="noopener">' + esc(p.place.split(',').slice(0, 2).join(',')) + '</a></div>'
      + '</div>';
    detail.scrollTop = 0; if (window.innerWidth <= 860) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#back').addEventListener('click', closeDetail);
    detail.querySelectorAll('img[data-i]').forEach((im) => im.addEventListener('click', () => lightbox(p, +im.dataset.i)));
    try { history.replaceState(null, '', '#' + p.id); } catch (e) { }
    if (!noFly) flyTo(p.lat, p.lng); else draw();
  }
  function openPartner(a, noFly) {
    current = a; side.classList.add('detail-on'); detail.classList.add('on');
    const meta = [['Relation', tierOf(a)], ['Type', a.kind], ['Discipline', a.discipline], ['Organization', a.org], ['Full name', a.fullName], ['Main contact', a.contact], ['Based in', a.noLocation ? 'Not on file yet' : a.place + (a.approx ? ' (' + a.approx + ')' : '')]].filter((m) => m[1]);
    const together = a.projects.map((id) => PBY[id]).sort(byYear);
    detail.innerHTML = '<button type="button" class="back" id="back">‹ All works</button>'
      + '<div class="phead"><div class="av ' + tcls(tierOf(a)) + '">' + esc(initials(a.name)) + '</div><div><h2 style="margin:0;font:700 22px/1.2 var(--font);letter-spacing:-.015em">' + esc(a.name) + '</h2><span class="badge-pa ' + tcls(tierOf(a)) + '" style="margin-left:0">' + esc(tierOf(a)) + '</span></div></div>'
      + '<div class="body"><p>' + esc(a.bio) + '</p>'
      + '<dl class="meta">' + meta.map((m) => '<dt>' + m[0] + '</dt><dd>' + esc(m[1]) + '</dd>').join('') + '</dl>'
      + ((a.web || (a.ig || []).length) ? '<div class="links">' + (a.web ? '<a href="' + esc(a.web) + '" target="_blank" rel="noopener">Website ↗</a>' : '') + (a.ig || []).map((h) => '<a href="https://www.instagram.com/' + esc(h) + '/" target="_blank" rel="noopener">@' + esc(h) + ' ↗</a>').join('') + '</div>' : '')
      + '<div class="together"><h3>Projects together · ' + together.length + '</h3>' + (together.length ? together.map((p) => '<button type="button" class="row' + (isUn(p) ? ' un' : '') + '" data-id="' + p.id + '">' + thumb(p) + '<span class="t"><b>' + esc(p.title) + (isUn(p) ? '<span class="badge-un">Unrealized</span>' : '') + '</b><span>' + esc(p.place.split(',').slice(0, 2).join(',')) + '</span></span><span class="y">' + esc(p.yearLabel || p.year || '—') + '</span></button>').join('') : '<div class="note" style="padding-top:6px">No shared project on the Atlas yet.</div>') + '</div>'
      + '<div class="note">' + (a.noLocation ? 'No base location on file: shown with a placeholder pin at the North Pole.' : 'Open in Google Maps: <a href="https://www.google.com/maps/search/?api=1&query=' + a.lat + ',' + a.lng + '" target="_blank" rel="noopener">' + esc(a.place.split(',').slice(0, 2).join(',')) + '</a>') + '</div>'
      + '</div>';
    detail.scrollTop = 0; if (window.innerWidth <= 860) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#back').addEventListener('click', closeDetail);
    detail.querySelectorAll('.together .row').forEach((b) => b.addEventListener('click', () => {
      const p = PBY[b.dataset.id]; if (isUn(p) && !show.unrealized) { show.unrealized = true; renderList(); } else if (!isUn(p) && !show.built) { show.built = true; renderList(); }
      open(p);
    }));
    try { history.replaceState(null, '', '#' + a.id); } catch (e) { }
    if (!noFly) flyTo(a.lat, a.lng); else draw();
  }
  function choose(g) {
    current = null; side.classList.add('detail-on'); detail.classList.add('on');
    detail.innerHTML = '<button type="button" class="back" id="back">‹ All works</button><div class="choose"><div class="hdr">' + g.items.length + (g.pa ? ' ' + (TIER_LBL[g.tier] || 'in network').toLowerCase() : ' works') + (g.pa && g.short === 'No base on file' ? ' with no base on file' : ' at ' + esc(g.short)) + '</div>'
      + (g.pa ? g.items.map(paRow).join('') : g.items.map((p) => '<button type="button" class="row' + (isUn(p) ? ' un' : '') + '" data-id="' + p.id + '">' + thumb(p) + '<span class="t"><b>' + esc(p.title) + (isUn(p) ? '<span class="badge-un">Unrealized</span>' : '') + '</b><span>' + esc(p.type) + '</span></span><span class="y' + (p.web ? ' web' : '') + '">' + esc(p.yearLabel || p.year || '—') + '</span></button>').join('')) + '</div>';
    $('#back').addEventListener('click', closeDetail);
    detail.querySelectorAll('.row').forEach((b) => b.addEventListener('click', () => openAny(byId(b.dataset.id))));
    flyTo(g.lat, g.lng, Math.max(k, 3));
  }
  function closeDetail() { current = null; side.classList.remove('detail-on'); detail.classList.remove('on'); try { history.replaceState(null, '', ' '); } catch (e) { } draw(); }

  // ---------- lightbox
  const lb = $('#lb'), lbImg = $('#lbImg'); let lbP = null, lbI = 0;
  function lightbox(p, i) { lbP = p; lbI = i; lbImg.src = p.imgs[i]; lbImg.alt = p.title; lb.classList.add('on'); }
  function lbStep(d) { if (!lbP) return; lbI = (lbI + d + lbP.imgs.length) % lbP.imgs.length; lbImg.src = lbP.imgs[lbI]; }
  $('#lbX').addEventListener('click', () => lb.classList.remove('on'));
  $('#lbL').addEventListener('click', () => lbStep(-1)); $('#lbR').addEventListener('click', () => lbStep(1));
  lb.addEventListener('click', (ev) => { if (ev.target === lb) lb.classList.remove('on'); });
  document.addEventListener('keydown', (ev) => { if (!lb.classList.contains('on')) return; if (ev.key === 'Escape') lb.classList.remove('on'); if (ev.key === 'ArrowLeft') lbStep(-1); if (ev.key === 'ArrowRight') lbStep(1); });

  // ---------- boot
  renderList(); resize();
  fetch('world.json').then((r) => r.json()).then((j) => { land = j; draw(); }).catch(() => { land = null; draw(); });
  const h = (location.hash || '').replace('#', ''); const start = byId(h);
  if (start && isUn(start) && !show.unrealized) { show.unrealized = true; renderList(); }
  if (start && isPa(start) && !show.partners) { show.partners = true; renderList(); }
  if (start) { openAny(start, true); rotation = [-start.lng, -start.lat, 0]; k = 2.6; projection.scale(baseScale * k); syncZoom(); draw(); }
  else if (spinning) startSpin();
})();
</script>
