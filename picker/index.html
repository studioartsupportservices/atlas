<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaSS Photo Picker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D1D1B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root {
  --bg: #F6F5F2; --surface: #FFFFFF; --surface-2: #EFEDE8; --ink: #1D1D1B; --ink-2: #5E5C57; --ink-3: #9A978F;
  --line: #E2DFD8; --accent: #1D1D1B; --web: #2F6FDB; --atlas: #1E8A5A; --cover: #D99A0B; --proc: #8A4FC7; --warn: #B4561B; --warn-bg: #FBEBDD;
  --radius: 10px; --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr; height: 100%; }

/* top bar */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.top h1 small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.roots { display: flex; gap: 8px; margin-left: 12px; }
.root { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
.root i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.root.ok i { background: var(--atlas); }
.root.need { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.root.need i { background: var(--warn); }
.top .sp { flex: 1; }
.saved { font-size: 12.5px; color: var(--ink-3); }
.saved.err { color: var(--warn); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #3a3a37; }

/* sidebar */
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.side-head input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font: inherit; }
.kinds { display: flex; gap: 6px; flex-wrap: wrap; }
.kind { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.kind.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.plist { overflow: auto; flex: 1; padding: 6px 0 20px; }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 14px; border-left: 3px solid transparent; cursor: pointer; }
.pitem:hover { background: var(--bg); }
.pitem.on { background: var(--surface-2); border-left-color: var(--accent); }
.pitem .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .m { grid-column: 1; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .b { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11.5px; }
.tag { border-radius: 999px; padding: 1px 7px; font-weight: 600; font-size: 11px; }
.tag.w { background: #E3ECFB; color: var(--web); }
.tag.a { background: #DDF1E7; color: var(--atlas); }
.tag.ready { background: var(--accent); color: #fff; }
.tag.nof { background: var(--warn-bg); color: var(--warn); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--ink-2); }

/* main */
.main { min-width: 0; min-height: 0; overflow: auto; }
.empty { max-width: 640px; margin: 60px auto; padding: 0 24px; color: var(--ink-2); }
.empty h2 { color: var(--ink); font-size: 22px; margin: 0 0 10px; }
.empty ol { padding-left: 20px; }
.empty li { margin: 6px 0; }
.empty .btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.empty code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
.phead { position: sticky; top: 0; z-index: 3; background: rgba(246,245,242,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 14px 22px 12px; }
.phead .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phead h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.phead .meta { color: var(--ink-3); font-size: 13px; }
.phead .sp { flex: 1; }
.phead a { color: var(--ink-2); font-size: 12.5px; }
.ready-tg { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.ready-tg.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 8px; font: inherit; }
.toolbar label { display: inline-flex; gap: 5px; align-items: center; }
.folders { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.folders b { color: var(--ink-2); font-weight: 600; }

.section { padding: 14px 22px 4px; }
.section h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.section h3 .hint { text-transform: none; letter-spacing: 0; color: var(--ink-3); font-weight: 400; font-size: 12px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; min-height: 92px; align-items: flex-start; }
.strip.dropzone { outline: 2px dashed transparent; border-radius: 8px; }
.strip .none { color: var(--ink-3); font-size: 12.5px; padding: 10px 0; }
.chipimg { position: relative; flex: none; width: 112px; }
.chipimg img, .chipimg .ph { width: 112px; height: 78px; object-fit: cover; border-radius: 6px; display: block; background: var(--surface-2); }
.chipimg .n { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 5px; }
.chipimg .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.72); color: #fff; font-size: 13px; line-height: 20px; padding: 0; }
.chipimg .cap { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.chipimg .cap.low { color: var(--warn); font-weight: 600; }
.chipimg[draggable="true"] { cursor: grab; }
.chipimg.dragging { opacity: .35; }
.copybtn { margin-left: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; padding: 8px 22px 60px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.tile.sel-w { border-color: var(--web); box-shadow: 0 0 0 1px var(--web); }
.tile.sel-a { border-color: var(--atlas); box-shadow: 0 0 0 1px var(--atlas); }
.tile.sel-w.sel-a { border-color: var(--web); box-shadow: 0 0 0 1px var(--web), 0 0 0 4px #DDF1E7; }
.thumb { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #E9E7E1; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; text-align: center; padding: 10px; }
.thumb .badges { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; }
.thumb .badges span { font-size: 11px; font-weight: 700; color: #fff; border-radius: 5px; padding: 1px 6px; }
.thumb .badges .bw { background: var(--web); }
.thumb .badges .ba { background: var(--atlas); }
.thumb .badges .bc { background: var(--cover); }
.thumb .low { position: absolute; top: 6px; right: 6px; background: var(--warn); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 1px 6px; }
.tinfo { padding: 7px 9px 4px; font-size: 11.5px; color: var(--ink-3); }
.tinfo .fn { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.tinfo .res.low { color: var(--warn); font-weight: 600; }
.tacts { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; padding: 6px 9px 9px; }
.tg { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tg.w.on { background: var(--web); border-color: var(--web); color: #fff; }
.tg.a.on { background: var(--atlas); border-color: var(--atlas); color: #fff; }
.tg.c { padding: 5px 9px; }
.tg:disabled { opacity: .35; cursor: not-allowed; }
.proc { display: flex; align-items: center; gap: 7px; padding: 0 9px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.proc input { width: 16px; height: 16px; accent-color: var(--proc); margin: 0; cursor: pointer; }
.proc.on { color: var(--proc); font-weight: 600; }
.tile.sel-p { border-color: var(--proc); box-shadow: 0 0 0 1px var(--proc); }
.thumb .badges .bp { background: var(--proc); }
.tag.p { background: #EFE4FA; color: var(--proc); }
.lb .bar .tg.p.on { background: var(--proc); border-color: var(--proc); color: #fff; }
.tg.c.on { background: var(--cover); border-color: var(--cover); color: #fff; }
.more { text-align: center; padding: 0 0 40px; }

/* lightbox */
.lb { position: fixed; inset: 0; background: #0C0C0B; z-index: 50; display: none; grid-template-rows: minmax(0, 1fr) auto; }
.lb.on { display: grid; }
.lb .imgwrap { position: relative; display: grid; place-items: center; min-height: 0; padding: 20px 70px 0; }
.lb img { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; }
.lb .imgwrap { overflow: hidden; }
.lb .bar { background: #111110; display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; color: #ddd; font-size: 13px; }
.lb .bar .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .bar .tg { background: #2a2a28; border-color: #3a3a37; color: #ddd; padding: 7px 14px; }
.lb .bar .tg.w.on { background: var(--web); border-color: var(--web); color: #fff; }
.lb .bar .tg.a.on { background: var(--atlas); border-color: var(--atlas); color: #fff; }
.lb .bar .tg.c.on { background: var(--cover); border-color: var(--cover); color: #fff; }
.lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 72px; border: 0; border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; font-size: 30px; }
.lb .nav:hover { background: rgba(255,255,255,.16); }
.lb .nav.l { left: 12px; } .lb .nav.r { right: 12px; }
.lb .close { position: absolute; top: 12px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 22px; }
.lb .keys { color: #888; font-size: 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.note { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; background: var(--surface); resize: vertical; min-height: 36px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Photo Picker <small>Studio SaSS · website &amp; Atlas</small></h1>
    <div class="roots">
      <button class="root" id="rootIA" type="button" title="The Info and Assets folder in My Drive › Applications Master Folder"><i></i><span>Info and Assets</span></button>
      <button class="root" id="rootB180" type="button" title="Shared drives › B180 Project folders › Complete"><i></i><span>B180 Complete</span></button>
    </div>
    <span class="sp"></span>
    <span class="saved" id="saved"></span>
    <button class="btn" id="btnExport" type="button" title="Download a copy of your picks">Export picks</button>
  </header>

  <aside class="side">

      <div class="kinds" id="kinds"></div>

    <div class="plist" id="plist"></div>
    <div class="side-foot" id="sideFoot"></div>

  <main class="main" id="main"></main>
</div>

<div class="lb" id="lb">

</div>

async function connect(key) {
  if (!supported) return;
  try {
    if (roots[key] && !rootOk[key]) {
      const perm = await roots[key].requestPermission({ mode: key === 'IA' ? 'readwrite' : 'read' });
      if (perm === 'granted') { rootOk[key] = true; afterConnect(key); return; }
    }
    const h = await window.showDirectoryPicker({ id: 'sass-' + key, mode: key === 'IA' ? 'readwrite' : 'read' });
    if (key === 'IA') {
      const names = []; for await (const [n] of h.entries()) names.push(n.toLowerCase());
      if (!names.includes('completed work')) { toast('That doesn’t look like “Info and Assets” — it should contain the Completed Work folder.'); return; }
    }
    roots[key] = h; rootOk[key] = true; await kvSet('root-' + key, h); afterConnect(key);
  } catch (e) { if (e.name !== 'AbortError') toast('Couldn’t open that folder: ' + e.message); }
}
async function afterConnect(key) {

async function restoreRoots() {

async function dirAt(root, parts, create = false) {
  let h = root;
  for (const part of parts) {
    if (!part) continue;
    try { h = await h.getDirectoryHandle(part, { create }); continue; } catch (e) { if (create) throw e; }
    let found = null; const lc = part.toLowerCase();
    for await (const [n, c] of h.entries()) if (c.kind === 'directory' && n.toLowerCase() === lc) { found = c; break; }
    if (!found) return null; h = found;
  }
  return h;
}
async function resolveFolder(spec) {           // 'IA:Completed Work/Project Images/SWING'
  const [key, rel] = spec.split(/:(.*)/s);
  if (!roots[key] || !rootOk[key]) return { missingRoot: key };
  const h = await dirAt(roots[key], rel.split('/'));
  return h ? { handle: h, key, rel } : { notFound: spec };
}
async function scan(dir, key, rel, out, depth = 0) {
  const entries = [];
  for await (const [name, h] of dir.entries()) entries.push([name, h]);
  entries.sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
  for (const [name, h] of entries) {
    if (name.startsWith('.') || name.startsWith('~$')) continue;
    const r = rel ? rel + '/' + name : name;
    if (h.kind === 'file' && IMG_RE.test(name)) {
      const path = key + ':' + r;
      const f = fileIndex.get(path) || { path, name, folder: rel.split('/').slice(-2).join(' / '), handle: h };
      f.handle = h; fileIndex.set(path, f); out.push(f);
      if (out.length >= 3000) return;
    } else if (h.kind === 'directory' && depth < 5 && !/^(__MACOSX|thumbs?|\.)/i.test(name)) {
      await scan(h, key, r, out, depth + 1);
    }
  }
}

window.addEventListener('beforeunload', (e) => { if (saveTimer) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  if (supported) {
    await restoreRoots();
    try { const b = await kvGet('picks'); if (b && b.projects) picks = b; } catch {}
    if (rootOk.IA) await loadPicks();
  }
  renderRoots(); renderList(); renderMain();
})();
</script>
