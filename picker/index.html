<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaSS Photo Picker</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D1D1B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root {
  --bg: #F6F5F2; --surface: #FFFFFF; --surface-2: #EFEDE8; --ink: #1D1D1B; --ink-2: #5E5C57; --ink-3: #9A978F;
  --line: #E2DFD8; --accent: #1D1D1B; --web: #2F6FDB; --atlas: #1E8A5A; --cover: #D99A0B; --proc: #8A4FC7; --warn: #B4561B; --warn-bg: #FBEBDD;
  --radius: 10px; --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr; height: 100%; }

/* top bar */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.top h1 small { font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.roots { display: flex; gap: 8px; margin-left: 12px; }
.root { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
.root i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.root.ok i { background: var(--atlas); }
.root.need { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.root.need i { background: var(--warn); }
.top .sp { flex: 1; }
.saved { font-size: 12.5px; color: var(--ink-3); }
.saved.err { color: var(--warn); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #3a3a37; }

/* sidebar */
.side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.side-head input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font: inherit; }
.kinds { display: flex; gap: 6px; flex-wrap: wrap; }
.kind { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.kind.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.plist { overflow: auto; flex: 1; padding: 6px 0 20px; }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 14px; border-left: 3px solid transparent; cursor: pointer; }
.pitem:hover { background: var(--bg); }
.pitem.on { background: var(--surface-2); border-left-color: var(--accent); }
.pitem .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .m { grid-column: 1; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .b { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 11.5px; }
.tag { border-radius: 999px; padding: 1px 7px; font-weight: 600; font-size: 11px; }
.tag.w { background: #E3ECFB; color: var(--web); }
.tag.a { background: #DDF1E7; color: var(--atlas); }
.tag.ready { background: var(--accent); color: #fff; }
.tag.nof { background: var(--warn-bg); color: var(--warn); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--ink-2); }

/* main */
.main { min-width: 0; min-height: 0; overflow: auto; }
.empty { max-width: 640px; margin: 60px auto; padding: 0 24px; color: var(--ink-2); }
.empty h2 { color: var(--ink); font-size: 22px; margin: 0 0 10px; }
.empty ol { padding-left: 20px; }
.empty li { margin: 6px 0; }
.empty .btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.empty code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
.phead { position: sticky; top: 0; z-index: 3; background: rgba(246,245,242,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 14px 22px 12px; }
.phead .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.phead h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.phead .meta { color: var(--ink-3); font-size: 13px; }
.phead .sp { flex: 1; }
.phead a { color: var(--ink-2); font-size: 12.5px; }
.ready-tg { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.ready-tg.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 8px; font: inherit; }
.toolbar label { display: inline-flex; gap: 5px; align-items: center; }
.folders { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.folders b { color: var(--ink-2); font-weight: 600; }

.section { padding: 14px 22px 4px; }
.section h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.section h3 .hint { text-transform: none; letter-spacing: 0; color: var(--ink-3); font-weight: 400; font-size: 12px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; min-height: 92px; align-items: flex-start; }
.strip.dropzone { outline: 2px dashed transparent; border-radius: 8px; }
.strip .none { color: var(--ink-3); font-size: 12.5px; padding: 10px 0; }
.chipimg { position: relative; flex: none; width: 112px; }
.chipimg img, .chipimg .ph { width: 112px; height: 78px; object-fit: cover; border-radius: 6px; display: block; background: var(--surface-2); }
.chipimg .n { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.72); color: #fff; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 5px; }
.chipimg .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.72); color: #fff; font-size: 13px; line-height: 20px; padding: 0; }
.chipimg .cap { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.chipimg .cap.low { color: var(--warn); font-weight: 600; }
.chipimg[draggable="true"] { cursor: grab; }
.chipimg.dragging { opacity: .35; }
.copybtn { margin-left: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; padding: 8px 22px 60px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.tile.sel-w { border-color: var(--web); box-shadow: 0 0 0 1px var(--web); }
.tile.sel-a { border-color: var(--atlas); box-shadow: 0 0 0 1px var(--atlas); }
.tile.sel-w.sel-a { border-color: var(--web); box-shadow: 0 0 0 1px var(--web), 0 0 0 4px #DDF1E7; }
.thumb { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #E9E7E1; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; text-align: center; padding: 10px; }
.thumb .badges { position: absolute; top: 6px; left: 6px; display: flex; gap: 4px; }
.thumb .badges span { font-size: 11px; font-weight: 700; color: #fff; border-radius: 5px; padding: 1px 6px; }
.thumb .badges .bw { background: var(--web); }
.thumb .badges .ba { background: var(--atlas); }
.thumb .badges .bc { background: var(--cover); }
.thumb .low { position: absolute; top: 6px; right: 6px; background: var(--warn); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 5px; padding: 1px 6px; }
.tinfo { padding: 7px 9px 4px; font-size: 11.5px; color: var(--ink-3); }
.tinfo .fn { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.tinfo .res.low { color: var(--warn); font-weight: 600; }
.tacts { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; padding: 6px 9px 9px; }
.tg { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tg.w.on { background: var(--web); border-color: var(--web); color: #fff; }
.tg.a.on { background: var(--atlas); border-color: var(--atlas); color: #fff; }
.tg.c { padding: 5px 9px; }
.tg:disabled { opacity: .35; cursor: not-allowed; }
.proc { display: flex; align-items: center; gap: 7px; padding: 0 9px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; user-select: none; }
.proc input { width: 16px; height: 16px; accent-color: var(--proc); margin: 0; cursor: pointer; }
.proc.on { color: var(--proc); font-weight: 600; }
.tile.sel-p { border-color: var(--proc); box-shadow: 0 0 0 1px var(--proc); }
.thumb .badges .bp { background: var(--proc); }
.tag.p { background: #EFE4FA; color: var(--proc); }
.lb .bar .tg.p.on { background: var(--proc); border-color: var(--proc); color: #fff; }
.tg.c.on { background: var(--cover); border-color: var(--cover); color: #fff; }
.more { text-align: center; padding: 0 0 40px; }

.hero-wrap { padding: 18px 22px 60px; }
.hero-wrap .intro { color: var(--ink-2); max-width: 760px; margin: 0 0 14px; }
.hero-tools { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--ink-2); }
.hcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
.hcard h3 { margin: 0 0 10px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
.hcard h3 .meta { color: var(--ink-3); font-weight: 400; font-size: 12.5px; }
.hcard h3 .chg { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--cover); }
.hcols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.hcol { min-width: 0; }
.hcol .lbl { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.hcol .lbl a { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--ink-3); cursor: pointer; text-decoration: underline; }
.hbig { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; background: var(--surface-2); display: block; }
.hnone { width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); font-size: 12.5px; }
.hopts { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; }
.hopts img { width: 74px; height: 52px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 2px solid transparent; flex: none; opacity: .85; }
.hopts img:hover { opacity: 1; }
.hopts img.on { border-color: var(--cover); opacity: 1; }
.tag.h { background: #FBF0D6; color: var(--cover); }
body.dropping .main { outline: 3px dashed var(--web); outline-offset: -8px; }
/* lightbox */
.lb { position: fixed; inset: 0; background: #0C0C0B; z-index: 50; display: none; grid-template-rows: minmax(0, 1fr) auto; }
.lb.on { display: grid; }
.lb .imgwrap { position: relative; display: grid; place-items: center; min-height: 0; padding: 20px 70px 0; }
.lb img { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; }
.lb .imgwrap { overflow: hidden; }
.lb .bar { background: #111110; display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; color: #ddd; font-size: 13px; }
.lb .bar .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .bar .tg { background: #2a2a28; border-color: #3a3a37; color: #ddd; padding: 7px 14px; }
.lb .bar .tg.w.on { background: var(--web); border-color: var(--web); color: #fff; }
.lb .bar .tg.a.on { background: var(--atlas); border-color: var(--atlas); color: #fff; }
.lb .bar .tg.c.on { background: var(--cover); border-color: var(--cover); color: #fff; }
.lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 72px; border: 0; border-radius: 8px; background: rgba(255,255,255,.08); color: #fff; font-size: 30px; }
.lb .nav:hover { background: rgba(255,255,255,.16); }
.lb .nav.l { left: 12px; } .lb .nav.r { right: 12px; }
.lb .close { position: absolute; top: 12px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 22px; }
.lb .keys { color: #888; font-size: 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
.note { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; background: var(--surface); resize: vertical; min-height: 36px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Photo Picker <small>Studio SaSS · website &amp; Atlas</small></h1>
    <div class="roots">
      <button class="root" id="rootIA" type="button" title="The Info and Assets folder in My Drive › Applications Master Folder"><i></i><span>Info and Assets</span></button>
      <button class="root" id="rootB180" type="button" title="Shared drives › B180 Project folders › Complete"><i></i><span>B180 Complete</span></button>
    </div>
    <span class="sp"></span>
    <span class="saved" id="saved"></span>
    <button class="btn" id="btnHero" type="button" title="See and change the hero shot of every project">★ Hero shots</button>
    <button class="btn" id="btnExport" type="button" title="Download a copy of your picks">Export picks</button>
  </header>

  <aside class="side">
    <div class="side-head">
      <input id="q" type="search" placeholder="Search projects…" autocomplete="off">
      <div class="kinds" id="kinds"></div>

    <div class="plist" id="plist"></div>

  <main class="main" id="main"></main>
</div>

  <div class="bar"><span class="fn" id="lbFn"></span><span class="keys">W website · P process · A Atlas · C cover · ← → · Esc</span><button class="tg w" id="lbW" type="button">Website</button><button class="tg p" id="lbP" type="button">Process</button><button class="tg a" id="lbA" type="button">Atlas</button><button class="tg c" id="lbC" type="button">★ Cover</button></div>
</div>
<div class="toast" id="toast"></div>

async function connect(key) {
  if (!supported) return;
  try {
    if (roots[key] && !rootOk[key]) {
      const perm = await roots[key].requestPermission({ mode: key === 'IA' ? 'readwrite' : 'read' });
      if (perm === 'granted') { rootOk[key] = true; afterConnect(key); return; }
    }
    const h = await window.showDirectoryPicker({ id: 'sass-' + key, mode: key === 'IA' ? 'readwrite' : 'read' });
    if (key === 'IA') {
      const names = []; for await (const [n] of h.entries()) names.push(n.toLowerCase());
      if (!names.includes('completed work')) { toast('That doesn’t look like “Info and Assets” — it should contain the Completed Work folder.'); return; }
    }
    roots[key] = h; rootOk[key] = true; await kvSet('root-' + key, h); afterConnect(key);
  } catch (e) { if (e.name !== 'AbortError') toast('Couldn’t open that folder: ' + e.message); }
}
async function afterConnect(key) {
  if (key === 'IA') await loadPicks();
  renderRoots(); renderList(); if (current) openProject(current); else renderMain();
}
async function restoreRoots() {
  for (const key of ['IA', 'B180']) {
    const h = await kvGet('root-' + key).catch(() => null);
    if (!h) continue;
    roots[key] = h;
    try { rootOk[key] = (await h.queryPermission({ mode: key === 'IA' ? 'readwrite' : 'read' })) === 'granted'; } catch { rootOk[key] = false; }
  }
}
async function dirAt(root, parts, create = false) {
  let h = root;
  for (const part of parts) {
    if (!part) continue;
    try { h = await h.getDirectoryHandle(part, { create }); continue; } catch (e) { if (create) throw e; }
    let found = null; const lc = part.toLowerCase();
    for await (const [n, c] of h.entries()) if (c.kind === 'directory' && n.toLowerCase() === lc) { found = c; break; }
    if (!found) return null; h = found;
  }
  return h;
}
async function resolveFolder(spec) {           // 'IA:Completed Work/Project Images/SWING'
  const [key, rel] = spec.split(/:(.*)/s);
  if (!roots[key] || !rootOk[key]) return { missingRoot: key };
  const h = await dirAt(roots[key], rel.split('/'));
  return h ? { handle: h, key, rel } : { notFound: spec };
}
async function scan(dir, key, rel, out, depth = 0) {
  const entries = [];
  for await (const [name, h] of dir.entries()) entries.push([name, h]);
  entries.sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
  for (const [name, h] of entries) {
    if (name.startsWith('.') || name.startsWith('~$')) continue;
    const r = rel ? rel + '/' + name : name;
    if (h.kind === 'file' && IMG_RE.test(name)) {
      const path = key + ':' + r;
      const f = fileIndex.get(path) || { path, name, folder: rel.split('/').slice(-2).join(' / '), handle: h };
      f.handle = h; fileIndex.set(path, f); out.push(f);
      if (out.length >= 3000) return;
    } else if (h.kind === 'directory' && depth < 5 && !/^(__MACOSX|thumbs?|\.)/i.test(name)) {
      await scan(h, key, r, out, depth + 1);
    }
  }
}

// ---------- picks file
async function picksDir(create) { return roots.IA && rootOk.IA ? dirAt(roots.IA, PICKS_PATH, create) : null; }
async function loadPicks() {
  let fromFile = null, fromDb = null;
  try { const d = await picksDir(false); if (d) { const fh = await d.getFileHandle(PICKS_FILE); fromFile = JSON.parse(await (await fh.getFile()).text()); } } catch {}
  try { fromDb = await kvGet('picks'); } catch {}
  const pick = [fromFile, fromDb].filter(Boolean).sort((a, b) => String(b.updated).localeCompare(String(a.updated)))[0];
  if (pick && pick.projects) picks = pick;
}
let saveTimer = null;
function changed() {
  picks.updated = new Date().toISOString();
  kvSet('picks', picks).catch(() => {});
  $('#saved').className = 'saved'; $('#saved').textContent = 'Saving…';
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700);
  renderList();
}
async function saveNow() {
  saveTimer = null;
  const el = $('#saved');
  try {
    const d = await picksDir(true);
    if (!d) throw new Error('connect Info and Assets to save');
    const fh = await d.getFileHandle(PICKS_FILE, { create: true });
    const w = await fh.createWritable(); await w.write(JSON.stringify(picks, null, 1)); await w.close();
    el.className = 'saved'; el.textContent = 'Saved to Drive · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

}
function exportPicks() {

  a.download = PICKS_FILE; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

// ---------- thumbnails
const queue = []; let active = 0;
function wantThumb(f, img) { queue.push([f, img]); pump(); }
function pump() {
  while (active < 3 && queue.length) {
    const [f, img] = queue.shift();
    if (!img.isConnected) continue;
    active++; makeThumb(f).then((u) => { if (u && img.isConnected) { img.src = u; img.hidden = false; const ph = img.parentElement.querySelector('.ph'); if (ph) ph.remove(); } updateInfo(f); }).finally(() => { active--; pump(); });
  }
}
async function makeThumb(f) {
  if (urlCache.has(f.path)) return urlCache.get(f.path);
  if (f.web) { const u = webUrl(f.web, '500w'); urlCache.set(f.path, u); if (!f.w) { const im = new Image(); im.onload = () => { f.w = im.naturalWidth; f.h = im.naturalHeight; updateInfo(f); }; im.src = webUrl(f.web, '2500w'); } return u; }
  try {
    const file = await f.handle.getFile();
    f.size = file.size; f.mtime = file.lastModified;
    const key = f.path + '|' + file.size + '|' + file.lastModified;
    const hit = await thGet(key);
    if (hit) { f.w = hit.w; f.h = hit.h; const u = URL.createObjectURL(hit.blob); urlCache.set(f.path, u); return u; }
    if (NO_PREVIEW.test(f.name)) { f.noPreview = true; return null; }
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    f.w = bmp.width; f.h = bmp.height;
    const s = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * s)); c.height = Math.max(1, Math.round(bmp.height * s));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close();
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.8));
    thSet(key, { blob, w: f.w, h: f.h });
    const u = URL.createObjectURL(blob); urlCache.set(f.path, u); return u;
  } catch (e) { f.err = true; return null; }
}
const io = new IntersectionObserver((ents) => { for (const e of ents) if (e.isIntersecting) { io.unobserve(e.target); const f = fileIndex.get(e.target.dataset.path); if (f) wantThumb(f, e.target); } }, { rootMargin: '600px' });

  const all = Object.values(picks.projects);

async function openProject(id) {
  current = id; shown = PAGE; renderList();
  const p = proj(id), s = P(id), m = $('#main');
  m.innerHTML = headHtml(p, s) + '<div class="section" id="loading" style="color:var(--ink-3)">Reading folders…</div>';
  bindHead(p, s);
  const specs = [...p.src, ...(s.folders || [])];
  files = []; const notes = [];
  for (const spec of specs) {
    const r = await resolveFolder(spec);
    if (r.missingRoot) { notes.push('Connect <b>' + (r.missingRoot === 'IA' ? 'Info and Assets' : 'B180 Complete') + '</b> to see ' + esc(spec.split(':')[1])); continue; }
    if (r.notFound) { notes.push('Folder not found: ' + esc(spec)); continue; }
    try { await scan(r.handle, r.key, r.rel, files); } catch (e) { notes.push('Couldn’t read ' + esc(spec) + ': ' + esc(e.message)); }
  }
  if (current !== id) return;
  const site = SITE[id];
  const webFiles = [];
  if (site) {
    const names = new Set(files.map((f) => f.name.toLowerCase().replace(/\.[^.]+$/, '')));
    for (const x of [...site.bg, ...site.g]) {
      const path = 'WEB:' + x; if (files.some((f) => f.path === path)) continue;
      const nm = decodeURIComponent(x.split('/').pop().replace(/\+/g, ' '));
      const f = fileIndex.get(path) || { path, name: nm, folder: 'On the website now', web: x, dupe: names.has(nm.toLowerCase().replace(/\.[^.]+$/, '')) };
      fileIndex.set(path, f); webFiles.push(f);
    }
  }
  files = [...webFiles, ...files];
  const seen = new Set(); files = files.filter((f) => !seen.has(f.path) && seen.add(f.path));
  $('#folders').innerHTML = (specs.length ? 'Folders: ' + specs.map((x) => '<b>' + esc(x.replace(/^IA:/, '').replace(/^B180:/, 'B180 › ')) + '</b>').join(' · ') : 'No folder linked yet.') + (notes.length ? '<br>' + notes.join('<br>') : '') + ' · ' + files.length + ' photos';
  $('#loading').remove();
  renderBody();
}

async function addFolder(p, s) {
  try {
    const h = await window.showDirectoryPicker({ id: 'sass-add', mode: 'read' });
    for (const key of ['IA', 'B180']) {
      if (!roots[key] || !rootOk[key]) continue;
      const parts = await roots[key].resolve(h);
      if (parts) { const spec = key + ':' + parts.join('/'); if (!s.folders.includes(spec) && !p.src.includes(spec)) { s.folders.push(spec); changed(); } openProject(p.id); return; }

  } catch (e) { if (e.name !== 'AbortError') toast(e.message); }
}

function info(f) { if (f.web) return (f.w ? f.w + ' × ' + f.h + ' · ' : '') + 'on the website now' + (f.dupe ? ' · also in Drive' : ''); return (f.w ? f.w + ' × ' + f.h : f.err ? 'couldn’t read' : '…') + (f.size ? ' · ' + (f.size / 1048576).toFixed(f.size > 10485760 ? 0 : 1) + ' MB' : '') + (f.folder ? ' · ' + esc(f.folder) : ''); }
function updateInfo(f) {
  const t = document.querySelector('.tile[data-path="' + CSS.escape(f.path) + '"]'); if (!t) return;
  const r = t.querySelector('.res'); r.innerHTML = info(f); r.classList.toggle('low', !!(f.w && Math.max(f.w, f.h) < LOW));
  if (f.w && Math.max(f.w, f.h) < LOW && !t.querySelector('.thumb .low')) t.querySelector('.thumb').insertAdjacentHTML('beforeend', '<span class="low">LOW-RES</span>');
  if (f.noPreview) { const ph = t.querySelector('.ph'); if (ph) ph.innerHTML = 'No preview (' + esc(f.name.split('.').pop().toUpperCase()) + ')<br>still selectable'; }
  if (f.err) { const ph = t.querySelector('.ph'); if (ph) ph.textContent = 'Couldn’t load — file may still be downloading from Drive'; }
  if (P(current).web.includes(f.path) || P(current).atlas.includes(f.path) || P(current).process.includes(f.path)) renderStrips();
}
function refreshTiles() {
  document.querySelectorAll('.tile').forEach((t) => {
    const f = fileIndex.get(t.dataset.path); if (!f) return;
    const tmp = document.createElement('div'); tmp.innerHTML = tileHtml(f); const n = tmp.firstChild;
    t.className = n.className; t.querySelector('.badges').innerHTML = n.querySelector('.badges').innerHTML;
    t.querySelector('.tacts').replaceWith(n.querySelector('.tacts')); t.querySelector('.proc').replaceWith(n.querySelector('.proc'));
  });
}
function toggle(path, t) {
  const s = P(current);
  if (t === 'process') {
    const i = s.process.indexOf(path);
    if (i >= 0) { s.process.splice(i, 1); if (!s.web.includes(path)) s.web.push(path); }
    else { s.web = s.web.filter((x) => x !== path); s.atlas = s.atlas.filter((x) => x !== path); if (s.cover === path) s.cover = null; s.process.push(path); }
    changed(); renderStrips(); refreshTiles(); if (lbOn) lbSync(); return;
  }
  if (s.process.includes(path)) {
    if (t === 'web') { s.process = s.process.filter((x) => x !== path); changed(); renderStrips(); refreshTiles(); if (lbOn) lbSync(); }
    else toast('Process photos go on the website only — untick “Process photo” first.');
    return;
  }
  if (t === 'cover') { s.cover = s.cover === path ? null : path; if (s.cover && !s.web.includes(path) && !s.atlas.includes(path)) { s.web.unshift(path); s.atlas.unshift(path); } }
  else { const a = s[t], i = a.indexOf(path); if (i >= 0) a.splice(i, 1); else a.push(path); if (s.cover === path && !s.web.includes(path) && !s.atlas.includes(path)) s.cover = null; }
  changed(); renderStrips(); refreshTiles(); if (lbOn) lbSync();
}

// ---------- lightbox
let lbOn = false, lbList = [], lbI = 0, lbUrl = null;
async function lbOpen(path) {
  lbList = visibleFiles().map((f) => f.path); lbI = Math.max(0, lbList.indexOf(path)); lbOn = true; $('#lb').classList.add('on'); await lbShow();
}
async function lbShow() {
  const f = fileIndex.get(lbList[lbI]); if (!f) return;
  $('#lbFn').textContent = f.name + '  ·  ' + (f.w ? f.w + ' × ' + f.h : '') + (f.size ? '  ·  ' + (f.size / 1048576).toFixed(1) + ' MB' : '') + '  ·  ' + (lbI + 1) + ' / ' + lbList.length;
  lbSync();
  const img = $('#lbImg'); img.src = urlCache.get(f.path) || '';
  if (f.web) { img.src = webUrl(f.web, '2500w'); return; }
  try { const file = await f.handle.getFile(); if (lbUrl) URL.revokeObjectURL(lbUrl); lbUrl = URL.createObjectURL(file); if (lbList[lbI] === f.path && !NO_PREVIEW.test(f.name)) img.src = lbUrl; } catch {}
}
function lbSync() { const s = P(current), p = lbList[lbI]; $('#lbW').classList.toggle('on', s.web.includes(p) || s.process.includes(p)); $('#lbP').classList.toggle('on', s.process.includes(p)); $('#lbA').classList.toggle('on', s.atlas.includes(p)); $('#lbC').classList.toggle('on', s.cover === p); }
function lbClose() { lbOn = false; $('#lb').classList.remove('on'); $('#lbImg').src = ''; if (lbUrl) { URL.revokeObjectURL(lbUrl); lbUrl = null; } }
function lbStep(d) { if (!lbList.length) return; lbI = (lbI + d + lbList.length) % lbList.length; lbShow(); }


// ---------- hero shots
let heroOnlyChanged = false;
function heroData(id) {
  const s = picks.projects[id] || {}, site = SITE[id], at = ATLAS[id] || [];
  const webOpts = site ? [...new Set([...site.bg, ...site.g].map((x) => x))] : [];
  return { at, webOpts, atCur: s.heroAtlas || at[0] || null, webCur: s.heroWeb || (site && (site.bg[0] || site.g[0])) || null, atOrig: at[0] || null, webOrig: site ? (site.bg[0] || site.g[0]) : null };
}
function renderHero() {
  const m = $('#main'), q = query.toLowerCase();
  const list = PROJECTS.filter((p) => (ATLAS[p.id] && ATLAS[p.id].length) || SITE[p.id]).filter((p) => !q || (p.title + ' ' + (p.place || '')).toLowerCase().includes(q))
    .filter((p) => { if (!heroOnlyChanged) return true; const s = picks.projects[p.id] || {}; return s.heroAtlas || s.heroWeb; });
  m.innerHTML = '<div class="hero-wrap"><h2 style="margin:0 0 6px">Hero shots</h2><p class="intro">The big image is the hero each project uses now — on the Atlas (its first photo) and on the website page (the top banner). Click any of the smaller photos to make it the hero instead. Changes save to your picks; tell Claude when you are done and they get applied.</p>'
    + '<div class="hero-tools"><label><input type="checkbox" id="onlyChg"' + (heroOnlyChanged ? ' checked' : '') + '> Only show changed</label><span>' + list.length + ' projects</span></div>'
    + list.map((p) => {
      const h = heroData(p.id), s = picks.projects[p.id] || {};
      const changed = (s.heroAtlas && s.heroAtlas !== h.atOrig) || (s.heroWeb && s.heroWeb !== h.webOrig);
      const col = (kind, label, cur, opts, url, orig, link) => '<div class="hcol"><div class="lbl">' + label + (link || '') + ((kind === 'a' ? s.heroAtlas : s.heroWeb) ? ' <a data-reset="' + kind + '" data-id="' + p.id + '">reset</a>' : '') + '</div>'
        + (cur ? '<img class="hbig" loading="lazy" src="' + url(cur, true) + '" alt="">' : '<div class="hnone">' + (kind === 'a' ? 'No Atlas photos yet' : 'No website page yet') + '</div>')
        + (opts.length > 1 ? '<div class="hopts">' + opts.map((o) => '<img loading="lazy" data-k="' + kind + '" data-id="' + p.id + '" data-v="' + esc(o) + '" class="' + (o === cur ? 'on' : '') + '" src="' + url(o, false) + '" alt="" title="Make this the hero">').join('') + '</div>' : '') + '</div>';
      return '<div class="hcard"><h3>' + esc(p.title) + '<span class="meta">' + esc([p.kind, p.year].filter(Boolean).join(' · ')) + '</span>' + (changed ? '<span class="chg">★ changed</span>' : '') + '</h3><div class="hcols">'
        + col('a', 'Atlas hero', h.atCur, h.at, (x, big) => ATLAS_BASE + x, h.atOrig, '')
        + col('w', 'Website hero', h.webCur, h.webOpts, (x, big) => webUrl(x, big ? '1000w' : '300w'), h.webOrig, p.web ? ' <a href="' + esc(p.web) + '" target="_blank" rel="noopener">page ↗</a>' : '')
        + '</div></div>';
    }).join('') + '</div>';
  $('#onlyChg').onchange = (e) => { heroOnlyChanged = e.target.checked; renderHero(); };
}
$('#main').addEventListener('click', (e) => {
  if (mode !== 'hero') return;
  const t = e.target.closest('.hopts img'); if (t) { const s = P(t.dataset.id), h = heroData(t.dataset.id), v = t.dataset.v; if (t.dataset.k === 'a') s.heroAtlas = v === h.atOrig ? null : v; else s.heroWeb = v === h.webOrig ? null : v; changed(); renderHero(); return; }
  const r = e.target.closest('[data-reset]'); if (r) { const s = P(r.dataset.id); if (r.dataset.reset === 'a') s.heroAtlas = null; else s.heroWeb = null; changed(); renderHero(); }
});
$('#btnHero').onclick = () => { mode = 'hero'; current = null; $('#btnHero').classList.add('primary'); renderList(); renderHero(); };


// ---------- upload from computer into the project's folder
function uploadTarget(p, s) {
  const spec = [...p.src, ...(s.folders || [])].find((x) => !/\/Archive\//.test(x));
  if (spec) return spec;
  const kindRoot = p.kind === 'Unrealized' ? 'IA:Unrealized Projects/Project Descriptions/' : p.kind === 'Production' ? 'IA:Production/' : 'IA:Completed Work/Project Images/';
  return kindRoot + p.title.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
}
async function uploadFiles(p, s, list) {
  const imgs = list.filter((f) => IMG_RE.test(f.name));
  if (!imgs.length) return toast('No photos in that selection (JPG, PNG, WEBP, HEIC, TIFF).');
  const spec = uploadTarget(p, s); const [key, rel] = spec.split(/:(.*)/s);
  if (!roots[key]) return toast('Connect ' + (key === 'IA' ? 'Info and Assets' : 'B180 Complete') + ' first.');
  try { if ((await roots[key].queryPermission({ mode: 'readwrite' })) !== 'granted' && (await roots[key].requestPermission({ mode: 'readwrite' })) !== 'granted') return toast('The app needs permission to save into that folder.'); }
  catch (e) { return toast(e.message); }
  let dir; try { dir = await dirAt(roots[key], rel.split('/'), true); } catch (e) { return toast('Couldn’t open ' + rel + ': ' + e.message); }
  const existing = new Set(); for await (const [n] of dir.entries()) existing.add(n.toLowerCase());
  let done = 0;
  for (const f of imgs) {
    let name = f.name, i = 2; const dot = name.lastIndexOf('.'), base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : '';
    while (existing.has(name.toLowerCase())) name = base + ' (' + (i++) + ')' + ext;
    existing.add(name.toLowerCase());
    try { const fh = await dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(f); await w.close(); done++; toast('Uploading ' + done + ' of ' + imgs.length + '…'); }
    catch (e) { toast('Couldn’t save ' + f.name + ': ' + e.message); }
  }
  if (!p.src.includes(spec) && !(s.folders || []).includes(spec)) { s.folders.push(spec); changed(); }
  toast(done + ' photo' + (done === 1 ? '' : 's') + ' saved to ' + rel.split('/').slice(-2).join(' › '));
  openProject(p.id);
}
document.addEventListener('dragover', (e) => { if (mode === 'pick' && current && e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); document.body.classList.add('dropping'); } });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
document.addEventListener('drop', (e) => { document.body.classList.remove('dropping'); if (mode !== 'pick' || !current || !e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); uploadFiles(proj(current), P(current), [...e.dataTransfer.files]); });

// ---------- events
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3800); }
$('#rootIA').onclick = () => connect('IA');
$('#rootB180').onclick = () => connect('B180');
$('#btnExport').onclick = exportPicks;
$('#q').oninput = (e) => { query = e.target.value; renderList(); if (mode === 'hero') renderHero(); };
$('#kinds').onclick = (e) => { const b = e.target.closest('.kind'); if (b) { filterKind = b.dataset.k; renderList(); } };
$('#plist').onclick = (e) => { const it = e.target.closest('.pitem'); if (it) { mode = 'pick'; $('#btnHero').classList.remove('primary'); openProject(it.dataset.id); } };
$('#main').addEventListener('click', (e) => {
  const c = e.target.closest('[data-connect]'); if (c) return connect(c.dataset.connect);
  if (e.target.matches('.proc input')) return toggle(e.target.closest('.tile').dataset.path, 'process');
  const tg = e.target.closest('.tile .tg'); if (tg) return toggle(tg.closest('.tile').dataset.path, tg.dataset.t);
  const th = e.target.closest('.thumb[data-open]'); if (th) return lbOpen(th.closest('.tile').dataset.path);
  const x = e.target.closest('.chipimg .x'); if (x) { const ch = x.closest('.chipimg'); const s = P(current); s[ch.dataset.kind].splice(+ch.dataset.i, 1); changed(); renderStrips(); refreshTiles(); return; }
  const ci = e.target.closest('.chipimg[data-path]'); if (ci && fileIndex.has(ci.dataset.path)) return lbOpen(ci.dataset.path);
});
// drag to reorder inside a strip
let drag = null;
$('#main').addEventListener('dragstart', (e) => { const ch = e.target.closest('.chipimg[draggable]'); if (!ch) return; drag = { kind: ch.dataset.kind, i: +ch.dataset.i }; ch.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
$('#main').addEventListener('dragend', (e) => { const ch = e.target.closest('.chipimg'); if (ch) ch.classList.remove('dragging'); drag = null; });
$('#main').addEventListener('dragover', (e) => { if (drag && e.target.closest('#strip-' + drag.kind)) e.preventDefault(); });
$('#main').addEventListener('drop', (e) => {
  if (!drag) return; const strip = e.target.closest('#strip-' + drag.kind); if (!strip) return; e.preventDefault();
  const chips = [...strip.querySelectorAll('.chipimg')]; let to = chips.length - 1;
  for (let i = 0; i < chips.length; i++) { const r = chips[i].getBoundingClientRect(); if (e.clientX < r.left + r.width / 2) { to = i; break; } }
  const a = P(current)[drag.kind]; const [it] = a.splice(drag.i, 1); if (to > drag.i) to--; a.splice(Math.max(0, to), 0, it);
  changed(); renderStrips(); refreshTiles();
});
$('#lbX').onclick = lbClose; $('#lbL').onclick = () => lbStep(-1); $('#lbR').onclick = () => lbStep(1);
$('#lbW').onclick = () => toggle(lbList[lbI], 'web'); $('#lbA').onclick = () => toggle(lbList[lbI], 'atlas'); $('#lbC').onclick = () => toggle(lbList[lbI], 'cover'); $('#lbP').onclick = () => toggle(lbList[lbI], 'process');
document.addEventListener('keydown', (e) => {
  if (!lbOn || e.target.closest('input, textarea, select')) return;
  const k = e.key.toLowerCase();
  if (k === 'escape') lbClose(); else if (k === 'arrowleft') lbStep(-1); else if (k === 'arrowright') lbStep(1);
  else if (k === 'w') toggle(lbList[lbI], 'web'); else if (k === 'a') toggle(lbList[lbI], 'atlas'); else if (k === 'c') toggle(lbList[lbI], 'cover'); else if (k === 'p') toggle(lbList[lbI], 'process');
});
window.addEventListener('beforeunload', (e) => { if (saveTimer) { e.preventDefault(); e.returnValue = ''; } });

(async function init() {
  if (supported) {
    await restoreRoots();
    try { const b = await kvGet('picks'); if (b && b.projects) picks = b; } catch {}
    if (rootOk.IA) await loadPicks();
  }
  renderRoots(); renderList(); renderMain();
})();
</script>
